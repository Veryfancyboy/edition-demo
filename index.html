function dark(hex){ var h=hex.replace('#',''); var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); return (0.299*r+0.587*g+0.114*b) < 140; }
function shade(hex, f){ var h=hex.replace('#',''); var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); function c(v){ v=Math.round(v*f); return Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0'); } return '#'+c(r)+c(g)+c(b); }

function render(){
  var h=(location.hash||'#home').slice(1), parts=h.split('/'), r=parts[0]||'home', v=document.getElementById('view'), html='', tab=r;
  if(r==='creator'){ html=vCreator(); }
  else if(r==='brand'){ html=vBrand(); }
  else if(r==='factory'){ html=vFactory(); }
  else if(r==='menu'){ html=vMenu(); tab='creator'; }
  else if(r==='make'){ html=vMake(parts[1]); tab='creator'; }
  else if(r==='p'){ html=vPre(parts[1]); tab=''; }
  else if(r==='me'){ html=vMe(); tab='creator'; }
  else if(r==='plan'){ html=vPlan(); }
  else { r='home'; tab='home'; html=vHome(); }
  v.innerHTML=html; tabs(tab);
  if(r==='creator') bindCreator(); if(r==='brand') bindBrand(); if(r==='factory') bindFactory(); if(r==='menu') bindMenu(); if(r==='make') bindMake(); if(r==='p') bindPre(parts[1]); if(r==='me') bindMe();
}
var lastRoute='';
window.addEventListener('hashchange', function(){ var nr=(location.hash||'#home').split('/')[0]; render(); if(nr!==lastRoute || nr==='#p') window.scrollTo(0,0); lastRoute=nr; });
lastRoute=(location.hash||'#home').split('/')[0];

})();
