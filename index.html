<style>
:root{--ink:#15171C;--sub:#5B606B;--mute:#8B8F98;--line:#E7E3DA;--bg:#F7F5F0;--card:#fff;--ac:#E4572E;--acs:#FFF0EA;--ok:#2F8F5B;--oks:#EAF6EF;--warn:#B7791F;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:92px}
header.top{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:20px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;text-decoration:none}
.logo i{font-style:normal;color:var(--ac)}
.tag{font-size:11px;font-weight:700;color:var(--sub);background:#ECE8E0;border-radius:99px;padding:3px 8px;letter-spacing:0}
.top .pl{font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:6px 11px;background:#fff}
main{padding:0 18px}
section{margin:22px 0}
h1{font-size:30px;line-height:1.25;letter-spacing:-.035em;margin:0 0 12px}
h2{font-size:21px;line-height:1.35;letter-spacing:-.025em;margin:0 0 12px}
h3{font-size:17px;margin:0 0 6px;letter-spacing:-.015em}
p{margin:0 0 10px}
.sub{color:var(--sub)}
.small{font-size:13.5px;color:var(--sub);line-height:1.5}
.tiny{font-size:12px;color:var(--mute);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:10px}
.stat>.card+.card,.grid2>.card+.card,.grid3>.card+.card{margin-top:0}
.ac{color:var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;border-radius:12px;padding:13px 18px;background:var(--ink);color:#fff;text-decoration:none;font-size:15.5px}
.btn.o{background:var(--ac)}
.btn.w{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}

.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:3px 9px;background:#ECE8E0;color:var(--sub)}
.pill.o{background:var(--acs);color:var(--ac)}
.pill.g{background:var(--oks);color:var(--ok)}
.pill.k{background:var(--ink);color:#fff}

.hero .art svg{height:100%;width:auto}
.kick{font-size:13px;font-weight:800;color:var(--ac);letter-spacing:.02em;margin-bottom:6px}

.trio .card{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start}
.trio .q{font-size:13px;font-weight:800;color:var(--mute);grid-column:1/3}
.trio .x{color:var(--sub);text-decoration:line-through;text-decoration-color:#c9c3b8}
.trio .ic{width:28px;height:28px;border-radius:50%;background:var(--acs);color:var(--ac);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
svg text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}
.calc .big{font-size:30px;font-weight:900;letter-spacing:-.03em}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}

.bar.g i{background:var(--ok)}

.prod .th svg{height:108px;width:auto}

.kv dt{color:var(--mute)}
.kv dd{margin:0;font-weight:700}
.pool{background:var(--acs);border:1px dashed #F2B39E;border-radius:14px;padding:13px 14px;font-size:14px}

.swb small{display:block;font-weight:500;color:var(--mute);font-size:11.5px}
.swb.on{border-color:var(--ac);background:var(--acs)}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;font-weight:800;color:var(--sub);margin-bottom:5px}

.res{background:var(--ink);color:#fff;border-radius:18px;padding:16px}
.res .big{font-size:28px;font-weight:900;letter-spacing:-.03em}
.res .tiny{color:#B9BDC6}
.sec-t{font-size:12.5px;font-weight:900;color:var(--mute);letter-spacing:.04em;margin:0 0 8px}
.tl{position:relative;margin:4px 0 0 10px;border-left:2px solid var(--line);padding-left:18px}
.tl .s{position:relative;padding:0 0 14px}
.tl .s:before{content:'';position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.tl .s.done:before{border-color:var(--ink);background:var(--ink)}
.tl .s.now:before{border-color:var(--ac)}
.tl .s b{display:block;font-size:15px}
.tl .s span{font-size:13px;color:var(--sub)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .card{padding:12px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:800}
td.r,th.r{text-align:right;white-space:nowrap}
.stack{display:flex;height:34px;border-radius:10px;overflow:hidden;margin:10px 0 8px}
.stack div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden}
.legend{display:grid;gap:6px;font-size:14px}
.legend div{display:flex;justify-content:space-between;gap:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.src a{color:var(--sub);word-break:break-all}

.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff}

.sticky-cta{position:fixed;left:0;right:0;bottom:70px;z-index:25;padding:0 18px}
.sticky-cta .in{max-width:524px;margin:0 auto;background:rgba(247,245,240,.96);padding:10px 0 4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11.5px;font-weight:700;color:var(--mute);text-decoration:none}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--ink)}
nav.tabs a.on svg{stroke:var(--ac)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(21,23,28,.5);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:11px 16px;border-radius:12px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.foot{margin:30px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.back{display:inline-block;font-size:14px;font-weight:700;color:var(--sub);text-decoration:none;margin-top:16px}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:12px;padding:12px 14px;font-size:14px}
.who3 .card{padding:13px}
.who3 h3{font-size:15.5px}
.who3 ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--sub)}
.wk{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wk b{color:var(--ac);font-size:14px}
.wk div{font-size:14.5px}
@media (min-width:600px){h1{font-size:34px}.hero .art{height:240px}}
</style>
</head>

function render(){
  var h=(location.hash||'#home').slice(1), parts=h.split('/'), r=parts[0]||'home', v=document.getElementById('view'), html='', tab=r;
  if(r==='menu'){ html=vMenu(); }
  else if(r==='make'){ html=vMake(parts[1]); }
  else if(r==='p'){ html=vPre(parts[1]); tab=''; }
  else if(r==='me'){ html=vMe(); }
  else if(r==='plan'){ html=vPlan(); }
  else { r='home'; tab='home'; html=vHome(); }
  v.innerHTML=html; tabs(tab);
  if(r==='home') bindHome(); if(r==='menu') bindMenu(); if(r==='make') bindMake(); if(r==='p') bindPre(parts[1]); if(r==='me') bindMe();
}
var lastRoute='';
window.addEventListener('hashchange', function(){ var nr=(location.hash||'#home').split('/')[0]; render(); if(nr!==lastRoute || nr==='#p') window.scrollTo(0,0); lastRoute=nr; });
lastRoute=(location.hash||'#home').split('/')[0];
render();
})();
