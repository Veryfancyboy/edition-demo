<style>
:root{--ink:#15171C;--sub:#5B606B;--mute:#8B8F98;--line:#E7E3DA;--bg:#F7F5F0;--card:#fff;--ac:#E4572E;--acs:#FFF0EA;--ok:#2F8F5B;--oks:#EAF6EF;--blue:#2F6FDB;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:96px}
header.top{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:20px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;text-decoration:none}
.logo i{font-style:normal;color:var(--ac)}
.tag{font-size:11px;font-weight:800;color:var(--sub);background:#ECE8E0;border-radius:99px;padding:3px 8px}
.who{font-size:12.5px;font-weight:800;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;text-decoration:none;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:0 18px}
section{margin:20px 0}
h1{font-size:27px;line-height:1.28;letter-spacing:-.035em;margin:0 0 10px}
h2{font-size:21px;line-height:1.35;letter-spacing:-.025em;margin:0 0 10px}
h3{font-size:16.5px;margin:0 0 6px;letter-spacing:-.015em}
p{margin:0 0 10px}
.sub{color:var(--sub)}
.small{font-size:13.5px;color:var(--sub);line-height:1.5}
.tiny{font-size:12px;color:var(--mute);line-height:1.5}
.kick{font-size:13px;font-weight:800;color:var(--ac);margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.card+.card{margin-top:10px}
.ac{color:var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;border-radius:12px;padding:13px 18px;background:var(--ink);color:#fff;text-decoration:none;font-size:15.5px}
.btn.o{background:var(--ac)}
.btn.w{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.s{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:3px 9px;background:#ECE8E0;color:var(--sub);white-space:nowrap}
.pill.o{background:var(--acs);color:var(--ac)}
.pill.g{background:var(--oks);color:var(--ok)}
.pill.k{background:var(--ink);color:#fff}
.pill.b{background:#E8F0FD;color:var(--blue)}
.sec-t{font-size:12.5px;font-weight:900;color:var(--mute);letter-spacing:.04em;margin:0 0 8px}
.bar{height:9px;background:#EEE9E0;border-radius:99px;overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
.bar.g i{background:var(--ok)}
.ed{display:flex;gap:12px;align-items:center;text-decoration:none}
.ed .th{flex:none;width:72px;height:80px;background:#F3EFE7;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ed .th svg{height:74px;width:auto}
.ed .meta{flex:1;min-width:0}
.ed .t{font-weight:800;font-size:15.5px;line-height:1.3}
.ib{flex:none;width:48px;height:48px;border-radius:12px;background:#F3EFE7;display:flex;align-items:center;justify-content:center}
.ib svg{width:24px;height:24px}
.preview{background:linear-gradient(180deg,#F3EFE7,#EDE7DC);border-radius:20px;height:280px;display:flex;align-items:center;justify-content:center;position:relative}
.preview svg{height:240px;width:auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 6px 9px;text-align:center;font-size:13px;font-weight:700}
.tile svg{height:50px;width:auto;display:block;margin:0 auto 4px}
.tile.on{border-color:var(--ac);background:var(--acs)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swb{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;background:#fff;font-size:14px;font-weight:700}
.swb i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.swb.on{border-color:var(--ac);background:var(--acs)}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;font-weight:800;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.res{background:var(--ink);color:#fff;border-radius:18px;padding:15px}
.res .big{font-size:26px;font-weight:900;letter-spacing:-.03em}
.res .tiny{color:#B9BDC6}
.tl{position:relative;margin:4px 0 0 10px;border-left:2px solid var(--line);padding-left:18px}
.tl .s{position:relative;padding:0 0 13px}
.tl .s:before{content:'';position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.tl .s.done:before{border-color:var(--ink);background:var(--ink)}
.tl .s.now:before{border-color:var(--ac)}
.tl .s b{display:block;font-size:15px}
.tl .s span{font-size:13px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:800}
td.r,th.r{text-align:right;white-space:nowrap}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.qty button{width:42px;height:42px;font-size:20px;font-weight:700}
.qty b{min-width:30px;text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}

nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--ink)}
nav.tabs a.on svg{stroke:var(--ac)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(21,23,28,.5);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:11px 16px;border-radius:12px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.5}
.beta{background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.5;margin-top:14px}
.beta b{color:#FF8A65}
.loading{padding:30px 0;text-align:center;color:var(--mute)}
.empty{padding:16px;text-align:center;color:var(--mute);font-size:14px;border:1.5px dashed var(--line);border-radius:14px}

.sticky-cta .in{max-width:524px;margin:0 auto;padding:8px 0}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.door{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px;text-decoration:none;min-height:112px;text-align:left}

.door b{font-size:15.5px;letter-spacing:-.02em;line-height:1.25}
.door span{font-size:12.5px;color:var(--sub);line-height:1.35}
.door em{font-style:normal;font-size:12px;font-weight:800;color:var(--ac);margin-top:auto}
.door.mine{border-color:var(--ac);background:var(--acs)}
.door .badge{position:absolute;top:10px;right:10px;font-style:normal;font-size:10.5px;font-weight:900;color:#fff;background:var(--ac);border-radius:99px;padding:2px 7px}
.door.svc{background:var(--ink);border-color:var(--ink);color:#fff}
.door.svc svg{stroke:#FF8A65}
.door.svc span{color:#C9CCD3}
.door.svc em{color:#FF8A65}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:700;text-decoration:none;color:var(--ink)}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#ECE8E0;border-radius:12px;padding:4px;gap:4px;margin-top:14px}
.seg a{text-align:center;padding:9px 0;border-radius:9px;font-weight:800;font-size:14px;text-decoration:none;color:var(--sub)}
.seg a.on{background:#fff;color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;font-weight:800;color:var(--sub);margin-top:4px}
.flow i{font-style:normal;color:var(--ac)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .card{margin:0}
.kpi .card b{display:block;font-size:19px;letter-spacing:-.02em;line-height:1.3}
.vb{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;white-space:nowrap}
.vb.ok{background:var(--oks);color:var(--ok)}
.vb.no{background:#FFF4E5;color:#B26A00}
.steps{display:grid;gap:9px;counter-reset:st}
.steps div{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.steps div:before{counter-increment:st;content:counter(st);flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
</style>
</head>

function clearSubs(){ S.unsubs.forEach(u=>{ try{u();}catch(e){} }); S.unsubs=[]; }
function sub(u){ S.unsubs.push(u); }
const V = ()=>document.getElementById('view');
function render(){
  clearSubs(); closeSheet();
  const h=(location.hash||'#/home').replace(/^#\/?/,''); const qi=h.indexOf('?'); const pth=qi>=0?h.slice(0,qi):h; const params=new URLSearchParams(qi>=0?h.slice(qi+1):'');
  const parts=pth.split('/'); const r=parts[0]||'home';
  if(!S.user){ V().innerHTML='<div class="loading">불러오는 중…</div>'; return; }
  const open=['start','p','o','admin','support','channels','door','home','terms',''];
  if(!S.profile && !open.includes(r)){ location.hash='#/start'; return; }
  let tab=r;
  try{
    if(r==='start') viewStart();
    else if(r==='door'){ tab='home'; viewDoor(parts[1]); }
    else if(r==='support'){ tab='link'; viewSupport(params.get('door')||''); }
    else if(r==='channels'){ tab='link'; viewChannels(); }
    else if(r==='p'){ tab=''; viewEdition(parts[1], parts[2]||''); }
    else if(r==='o'){ tab=''; viewOffer(parts[1], parts[2]||''); }
    else if(r==='new'||r==='make'){ tab='new'; viewNew(r==='make'?'':(parts[1]||''), params); }
    else if(r==='terms'){ tab='home'; viewTerms(); }
    else if(r==='ed'){ tab='mine'; viewManage(parts[1]); }
    else if(r==='mine') viewMine();
    else if(r==='crm'){ tab='admin'; viewCRM(parts[1]); }
    else if(r==='admin') viewAdmin();
    else if(r==='me') viewMe();
    else { tab='home'; viewHome(); }
  }catch(e){ console.error(e); V().innerHTML='<div class="empty" style="margin-top:20px">화면을 그리다 문제가 생겼어요: '+esc(e.message)+'</div>'; }
  tabs(tab);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);

async function addDoor(k){
  const roles=[...new Set([...rolesOf(S.profile), k])].sort((a,b)=>DK.indexOf(a)-DK.indexOf(b));
  const data={roles, role:roles[0]};
  if((k==='make'||k==='partner') && !S.profile.handle) data.handle='@'+String(S.profile.name||'me').replace(/\s+/g,'_');
  await setDoc(doc(db,'profiles',S.user.uid), data, {merge:true});
  S.profile={...S.profile, ...data}; toast(DOORS[k].n+' 문을 열었어요'); render();
}
function gate(k){
  if(!S.profile){ location.hash='#/start'; return true; }
  if(has(k)) return false;
  V().innerHTML=`<section><div class="kick">${DOORS[k].s}</div><h2>${DOORS[k].n} 문을 먼저 열어 주세요</h2><p class="sub">${DOORS[k].d}</p><button class="btn o full" id="gAdd">이 문 열기</button></section>`;
  document.getElementById('gAdd').onclick=()=>addDoor(k).catch(e=>toast('실패: '+e.message));
  return true;
}

  function html(){
    const needHandle = sel.has('make')||sel.has('partner');
    return `<section><div class="kick">에디션 시험판 v0.3</div><h1>무엇을 하고 싶으세요?</h1><p class="sub">여러 개 골라도 돼요. 고른 문에 맞는 화면을 보여 드려요.</p></section>
    <div class="doors" id="dsel">${DK.map(k=>`<button class="door ${sel.has(k)?'mine':''}" data-k="${k}">${sel.has(k)?'<i class="badge">선택</i>':''}${icon(k)}<b>${DOORS[k].n}</b><span>${DOORS[k].s}</span></button>`).join('')}</div>
    <section><label class="field"><span>이름 (닉네임·상호)</span><input id="fName" maxlength="30" value="${esc(keep.name)}"></label>
    ${needHandle? `<label class="field"><span>내 계정 (@아이디)</span><input id="fHandle" maxlength="30" value="${esc(keep.handle)}" placeholder="@my_handle"></label><div class="grid2"><label class="field"><span>주 플랫폼</span><select id="fPlat">${['인스타그램','유튜브','틱톡','블로그'].map(x=>`<option ${pr.platform===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>팔로워 수</span><input id="fFol" type="number" inputmode="numeric" min="0" value="${esc(keep.followers)}"></label></div>`:''}
    <button class="btn o full" id="fSave">${S.profile?'저장하기':'시작하기'}</button>${beta()}</section>`;
  }
  function grab(){ const n=document.getElementById('fName'), hd=document.getElementById('fHandle'), fo=document.getElementById('fFol'); if(n) keep.name=n.value; if(hd) keep.handle=hd.value; if(fo) keep.followers=fo.value; }
  function bind(){
    document.getElementById('dsel').onclick=e=>{ const b=e.target.closest('[data-k]'); if(!b) return; grab(); const k=b.dataset.k; if(sel.has(k)) sel.delete(k); else sel.add(k); V().innerHTML=html(); bind(); };
    document.getElementById('fSave').onclick=async()=>{
      grab();
      if(!sel.size){ toast('문을 하나 이상 골라 주세요'); return; }
      const name=keep.name.trim(); if(!name){ toast('이름을 넣어 주세요'); return; }
      const roles=DK.filter(k=>sel.has(k));
      const data={ roles, role:roles[0], name, updatedAt:serverTimestamp() };
      if(document.getElementById('fHandle')){ let hd=keep.handle.trim(); if(hd && hd[0]!=='@') hd='@'+hd; data.handle=hd||('@'+name.replace(/\s+/g,'_')); data.platform=document.getElementById('fPlat').value; data.followers=parseInt(keep.followers||'0',10)||0; }
      if(!S.profile) data.createdAt=serverTimestamp();
      try{ await setDoc(doc(db,'profiles',S.user.uid), data, {merge:true}); S.profile={...(S.profile||{}),...data}; toast('저장했어요'); location.hash='#/home'; }catch(err){ toast('저장 실패: '+err.message); }
    };
  }
  V().innerHTML=html(); bind();
}

/* ---------- 홈 ---------- */
function doorTile(k){ const mine=S.profile&&has(k); return `<a class="door ${mine?'mine':''}" href="#/door/${k}">${mine?'<i class="badge">내 문</i>':''}${icon(k)}<b>${DOORS[k].n}</b><span>${DOORS[k].s}</span><em id="st_${k}">…</em></a>`; }
function svcTile(k){ const d = k==='support' ? ['정부 지원 사업','문마다 맞는 사업 연결','support'] : ['팔 곳 연결','온라인몰·매장·해외 판로','route']; return `<a class="door svc" href="#/${k}">${icon(d[2])}<b>${d[0]}</b><span>${d[1]}</span><em id="st_${k}">…</em></a>`; }
function myActions(){
  const a=[]; if(has('make')) a.push(['에디션 만들기','#/new/edition']); if(has('sell')) a.push(['상품 올리기','#/new/offer']); if(has('factory')) a.push(['생산 슬롯 열기','#/new/slot']); if(has('partner')) a.push(['팔 상품 고르기','#/door/partner']); if(has('invest')) a.push(['투자 현황판','#/door/invest']); if(has('buy')) a.push(['만들어 주세요 요청','#/new/wish']); if(has('channel')) a.push(['팔 곳 등록','#/new/channel']);
  return `<section><div class="sec-t">내 문에서 바로 하기</div><div class="chips">${a.map(x=>`<a class="chip" href="${x[1]}">${x[0]}</a>`).join('')}<a class="chip" href="#/support">맞는 지원 사업</a></div></section>`;
}
function viewHome(){
  const me=S.profile;
  V().innerHTML=`<section><div class="kick">에디션 시험판 v0.3</div><h1>만들고 싶은 사람부터<br>팔 곳까지, 한 앱에서 이어요.</h1><div class="flow">${['만들기','투자','생산','판매','구매','팔 곳'].map((x,i)=>(i?'<i>→</i>':'')+x).join(' ')}</div>${me?'':'<a class="btn o full" href="#/start" style="margin-top:14px">내 문 고르고 시작하기</a>'}</section>
  <div class="doors">${DK.map(doorTile).join('')}${svcTile('support')}${svcTile('channels')}</div>
  ${me? myActions() : ''}
  <a class="btn w full" href="#/terms" style="margin-top:12px">표준 조건표 · 품질 관문 · 크리에이터 몫 계산기</a>
  <section><div class="sec-t">선주문 진행 중</div><div id="hPre"><div class="loading">불러오는 중…</div></div></section>
  <section><div class="sec-t">만들어 주세요 (사고 싶은 사람들의 요청)</div><div id="hWish"><div class="loading">불러오는 중…</div></div><a class="btn w full" href="#/new/wish" style="margin-top:10px">나도 요청하기</a></section>
  <section><div class="sec-t">생산·발송</div><div id="hMake"></div></section>
  <section><div class="sec-t">판매 파트너를 찾는 상품</div><div id="hOffers"></div></section>${beta()}`;
  const st={support:'사업 '+SUPPORT.length+'개'};
  const upd=()=>{ Object.keys(st).forEach(k=>{ const el=document.getElementById('st_'+k); if(el) el.textContent=st[k]; }); };
  sub(onSnapshot(query(collection(db,'editions'), orderBy('createdAt','desc'), limit(100)), snap=>{
    const all=snap.docs.map(d=>({id:d.id,...d.data()}));
    const pre=all.filter(e=>e.status==='pre'), mk=all.filter(e=>['closed','making','shipped'].includes(e.status));
    st.make='에디션 '+all.length+'개'; st.buy='선주문 '+all.reduce((s,e)=>s+(e.sold||0),0).toLocaleString('ko-KR')+'개'; st.invest='자금 필요 '+all.filter(e=>e.status==='pre'||e.status==='closed').length+'건'; upd();
    const a=document.getElementById('hPre'), b=document.getElementById('hMake'); if(!a) return;
    a.innerHTML = pre.length ? pre.slice(0,6).map(edCard).join('') : '<div class="empty">아직 열린 선주문이 없어요.</div>';
    b.innerHTML = mk.length ? mk.map(edCard).join('') : '<div class="empty">생산 중인 에디션이 아직 없어요.</div>';
  }, err=>{ const a=document.getElementById('hPre'); if(a) a.innerHTML='<div class="empty">불러오기 실패: '+esc(err.message)+'</div>'; }));
  sub(onSnapshot(query(collection(db,'factories'), limit(200)), s=>{ st.factory='공장 '+s.size+'곳'; upd(); }));
  sub(onSnapshot(query(collection(db,'offers'), orderBy('createdAt','desc'), limit(30)), snap=>{ st.sell='상품 '+snap.size+'개'; upd(); const c=document.getElementById('hOffers'); if(!c) return; const list=snap.docs.map(d=>({id:d.id,...d.data()})); c.innerHTML=list.length? list.map(offerCard).join('') : '<div class="empty">등록된 상품이 아직 없어요.</div>'; bindOfferButtons(c); }));
  sub(onSnapshot(query(collection(db,'channels'), limit(200)), s=>{ st.channel='등록 '+s.size+'곳'; st.channels='판로 '+(s.size+ROUTES.length)+'곳'; upd(); }));
  sub(onSnapshot(query(collection(db,'wishes'), orderBy('votes','desc'), limit(5)), snap=>{ const c=document.getElementById('hWish'); if(!c) return; const list=snap.docs.map(d=>({id:d.id,...d.data()})); c.innerHTML=list.length? list.map(wishCard).join('') : '<div class="empty">아직 요청이 없어요.</div>'; bindWish(c); }, ()=>{}));
  getCountFromServer(query(collection(db,'profiles'), where('roles','array-contains','partner'))).then(r=>{ st.partner='파트너 '+r.data().count+'명'; upd(); }).catch(()=>{ st.partner='링크로 판매'; upd(); });
  upd();
}

/* ---------- 상품·링크 ---------- */
function offerCard(o){ const can=S.profile&&has('partner'); return `<div class="card"><div class="row between" style="align-items:flex-start"><div><b>${esc(o.name)}</b> <span class="tiny">${esc(o.brand||'')}</span><div class="small">${won(o.price)} · 팔면 ${o.commission}% (${won(o.price*o.commission/100)})</div></div><span class="pill">${o.sold||0}개 팔림</span></div>${o.desc?`<div class="small" style="margin-top:6px">${esc(o.desc)}</div>`:''}<div class="row" style="margin-top:10px"><a class="btn w s" href="#/o/${o.id}">상품 보기</a>${can?`<button class="btn s" data-link="${o.id}">내 판매 링크 복사</button>`:''}</div>${proposeBtn('offer',o)}</div>`; }
function linkSheet(title,url){ sheet(`<h3>${esc(title)}</h3><p class="small">아래 링크를 길게 눌러 복사하세요.</p><label class="field"><input id="lkU" readonly value="${esc(url)}"></label><button class="btn w full" id="lkX">닫기</button>`); const i=document.getElementById('lkU'); i.focus(); i.select(); document.getElementById('lkX').onclick=closeSheet; }
async function copyLink(title,url,okMsg){ try{ await navigator.clipboard.writeText(url); toast(okMsg); }catch(e){ linkSheet(title,url); } }
function bindOfferButtons(root){ root.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>copyLink('내 판매 링크', location.origin+location.pathname+'#/o/'+b.dataset.link+'/'+S.user.uid, '판매 링크를 복사했어요')); bindPropose(root); }

/* ---------- 만들어 주세요 ---------- */
const VOTED = new Set(JSON.parse(localStorage.getItem('voted')||'[]'));
function wishCard(w){ const voted=VOTED.has(w.id); return `<div class="card"><div class="row between" style="align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><b>${esc(w.title)}</b><div class="tiny">${esc(CATN(w.cat))} · ${esc(w.price||'가격 미정')} · ${esc(w.nick||'')}</div>${w.desc?`<div class="small" style="margin-top:4px">${esc(w.desc)}</div>`:''}</div><button class="btn ${voted?'w':''} s" data-vote="${w.id}" ${voted?'disabled':''} style="flex:none">나도 원해요 ${w.votes||0}</button></div>${S.profile&&has('make')?`<a class="small" href="#/new/edition?wish=${w.id}" style="display:inline-block;margin-top:8px;font-weight:800;color:var(--ac)">이걸로 에디션 만들기 →</a>`:''}</div>`; }
function bindWish(root){ root.querySelectorAll('[data-vote]').forEach(b=>b.onclick=async()=>{ if(needProfile()) return; const id=b.dataset.vote; b.disabled=true; try{ const bt=writeBatch(db); bt.set(doc(db,'wishes',id,'votes',S.user.uid),{at:serverTimestamp()}); bt.update(doc(db,'wishes',id),{votes:increment(1)}); await bt.commit(); toast('요청에 힘을 보탰어요'); }catch(err){ toast(err.code==='permission-denied'?'이미 눌렀어요':'실패: '+err.message); } VOTED.add(id); localStorage.setItem('voted',JSON.stringify([...VOTED])); }); }

/* ---------- 제안 (팔 곳 ↔ 제품) ---------- */
function proposeBtn(kind,x){ if(!(S.profile&&has('channel')) || !S.user || x.ownerId===S.user.uid) return ''; return `<div style="margin-top:8px"><button class="btn w s" data-prop="${kind}|${x.id}|${esc(kind==='edition'?x.title:x.name)}|${x.ownerId}">이 ${kind==='edition'?'에디션':'상품'}에 입점 제안</button></div>`; }
function bindPropose(root){ root.querySelectorAll('[data-prop]').forEach(b=>b.onclick=ev=>{ ev.preventDefault(); if(needProfile()) return; const [type,id,name,owner]=b.dataset.prop.split('|'); proposeSheet(type,id,name,owner||''); }); }
async function proposeSheet(type,id,name,owner){
  const toChannel = type==='channel'||type==='route';
  let opts='';
  if(toChannel){ try{ const [eds,ofs]=await Promise.all([getDocs(query(collection(db,'editions'),where('ownerId','==',S.user.uid))), getDocs(query(collection(db,'offers'),where('ownerId','==',S.user.uid)))]); opts=eds.docs.map(d=>`<option>에디션 · ${esc(d.data().title)}</option>`).join('')+ofs.docs.map(d=>`<option>상품 · ${esc(d.data().name)}</option>`).join(''); }catch(e){} }
  sheet(`<h3>${type==='route'?'입점 연결 요청':'입점 제안'}</h3><div class="small" style="margin-bottom:8px">받는 곳 <b style="color:var(--ink)">${esc(name)}</b></div>${toChannel?`<label class="field"><span>무엇을 제안할까요</span><select id="ppI">${opts}<option>아직 없음 (준비 중인 제품)</option></select></label>`:''}<label class="field"><span>한 줄 메시지 (80자)</span><input id="ppM" maxlength="80" placeholder="${toChannel?'예: 20대 여성 팔로워 5만, 12월 입점 희망':'예: 성수 매장에서 위탁 판매하고 싶어요'}"></label><div class="note" style="margin:10px 0">${type==='route'?'운영자가 확인하고 입점 절차를 이어 드려요.':'받는 사람의 내 현황에 바로 보여요.'} 시험판이라 외부로 연락은 가지 않아요.</div><button class="btn o full" id="ppOk">보내기</button><button class="btn w full" id="ppX" style="margin-top:8px">닫기</button>`);
  document.getElementById('ppX').onclick=closeSheet;
  document.getElementById('ppOk').onclick=async()=>{ const iEl=document.getElementById('ppI'); const btn=document.getElementById('ppOk'); btn.disabled=true; try{ await addDoc(collection(db,'proposals'),{ fromUid:S.user.uid, fromName:S.profile.name, toType:type, toId:id, toName:name, toOwnerId:owner, item: iEl? iEl.value : ('팔 곳 · '+(S.profile.name||'')), memo:document.getElementById('ppM').value.trim(), status:'new', createdAt:serverTimestamp() }); closeSheet(); toast('보냈어요'); }catch(err){ btn.disabled=false; toast('실패: '+err.message); } };
}

/* ---------- 정부 지원 사업 ---------- */
function supList(door){ return door ? SUPPORT.filter(s=>(s.doors||[]).includes(door)) : SUPPORT; }
function supCard(s){ const idx=SUPPORT.indexOf(s); const stt=SSTATE[s.state]||['','']; return `<div class="card"><div class="row between" style="align-items:flex-start;flex-wrap:nowrap"><b style="font-size:15px;line-height:1.35">${esc(s.name)}</b><span class="pill ${stt[1]}" style="flex:none">${stt[0]}</span></div><div class="tiny" style="margin-top:3px">${esc(s.org||'')}</div>${s.target?`<div class="small" style="margin-top:7px"><b style="color:var(--ink)">대상</b> ${esc(s.target)}</div>`:''}${s.benefit?`<div class="small"><b style="color:var(--ink)">지원</b> ${esc(s.benefit)}</div>`:''}${s.timing?`<div class="small"><b style="color:var(--ink)">시기</b> ${esc(s.timing)}</div>`:''}<div class="row" style="margin-top:10px">${s.url?`<a class="btn w s" href="${esc(s.url)}" target="_blank" rel="noopener">공식 안내</a>`:''}<button class="btn s" data-sup="${idx}">연결 요청</button></div></div>`; }
function bindSup(root){ root.querySelectorAll('[data-sup]').forEach(b=>b.onclick=()=>{ if(needProfile()) return; supportSheet(SUPPORT[+b.dataset.sup]); }); }
function supportSheet(s){
  sheet(`<h3>지원 사업 연결 요청</h3><div class="small" style="margin-bottom:8px">${esc(s.name)}</div><label class="field"><span>지금 단계</span><select id="sqS"><option>아이디어·예비 창업</option><option>사업자 있음 (3년 이내)</option><option>사업자 있음 (3~7년)</option><option>공장·제조사</option><option>소상공인</option></select></label><label class="field"><span>도움받고 싶은 것 (60자)</span><input id="sqM" maxlength="60" placeholder="예: 신청 자격 확인, 사업계획서 검토"></label><div class="note" style="margin:10px 0">운영자가 확인하고 이어 드려요. 신청은 본인이 공식 공고에서 해요. 시험판이라 외부로 연락은 가지 않아요.</div><button class="btn o full" id="sqOk">요청 보내기</button><button class="btn w full" id="sqX" style="margin-top:8px">닫기</button>`);
  document.getElementById('sqX').onclick=closeSheet;
  document.getElementById('sqOk').onclick=async()=>{ const btn=document.getElementById('sqOk'); btn.disabled=true; try{ await addDoc(collection(db,'supportRequests'),{ uid:S.user.uid, nick:S.profile.name, roles:rolesOf(S.profile), program:s.name, org:s.org||'', stage:document.getElementById('sqS').value, memo:document.getElementById('sqM').value.trim(), status:'new', createdAt:serverTimestamp() }); closeSheet(); toast('요청을 보냈어요'); }catch(err){ btn.disabled=false; toast('실패: '+err.message); } };
}
function viewSupport(door){
  const my=S.profile?rolesOf(S.profile):[]; let cur=door;
  function draw(){
    const list=supList(cur);
    V().innerHTML=`<div class="seg"><a href="#/support" class="on">정부 지원 사업</a><a href="#/channels">팔 곳 연결</a></div><section><h2>정부 지원 사업</h2><p class="small">문마다 맞는 실제 사업이에요. 공고 일정과 조건은 해마다 바뀌니 신청 전에 공식 안내를 꼭 확인하세요. 확인일 ${CHECKED}.</p><div class="chips" id="supF"><button class="chip ${cur===''?'on':''}" data-d="">전체 ${SUPPORT.length}</button>${DK.map(k=>{ const n=supList(k).length; return n?`<button class="chip ${cur===k?'on':''}" data-d="${k}">${DOORS[k].n}${my.includes(k)?' ★':''} ${n}</button>`:''; }).join('')}</div></section><div id="supL">${list.map(supCard).join('')||'<div class="empty">맞는 사업이 없어요.</div>'}</div><p class="tiny" style="margin-top:12px">★ 내 문 · 모집 중이 아닌 사업은 예년 공고를 기준으로 보여 드려요. 다음 공고가 나오면 바꿔요.</p>${beta()}`;
    document.getElementById('supF').onclick=e=>{ const b=e.target.closest('[data-d]'); if(!b) return; cur=b.dataset.d; draw(); };
    bindSup(document.getElementById('supL'));
  }
  draw();
}

/* ---------- 팔 곳 연결 ---------- */
function routeCard(r){ const i=ROUTES.indexOf(r); return `<div class="card"><div class="row between" style="align-items:flex-start;flex-wrap:nowrap"><b>${esc(r.name)}</b><span class="vb ${r.verified?'ok':'no'}" style="flex:none">${r.verified?'조건 확인됨':'조건 확인 필요'}</span></div><div class="tiny">${esc(r.type||'')}${r.fit?' · '+esc(r.fit):''}</div>${r.entry?`<div class="small" style="margin-top:7px"><b style="color:var(--ink)">입점</b> ${esc(r.entry)}</div>`:''}${r.fee?`<div class="small"><b style="color:var(--ink)">비용</b> ${esc(r.fee)}</div>`:''}<div class="row" style="margin-top:10px">${r.url?`<a class="btn w s" href="${esc(r.url)}" target="_blank" rel="noopener">${r.kind==='seller'?'판매자 안내':'사이트'}</a>`:''}<button class="btn s" data-prop="route|r${i}|${esc(r.name)}|">입점 연결 요청</button></div></div>`; }
function channelCard(c){ const mine=S.user&&c.ownerId===S.user.uid; return `<div class="card"><div class="row between"><b>${esc(c.name)}</b><span class="pill">${esc(CTYPES[c.ctype]||'기타')}</span></div><div class="small">${esc(c.region||'')}${c.wants?' · 찾는 품목 '+esc(c.wants):''}</div>${c.terms?`<div class="small">조건 ${esc(c.terms)}</div>`:''}${c.intro?`<div class="small" style="margin-top:4px">${esc(c.intro)}</div>`:''}${mine?'<div class="tiny" style="margin-top:8px">내가 등록한 곳이에요.</div>':`<div class="row" style="margin-top:10px"><button class="btn s" data-prop="channel|${c.id}|${esc(c.name)}|${c.ownerId}">입점 제안 보내기</button></div>`}</div>`; }
function viewChannels(){
  V().innerHTML=`<div class="seg"><a href="#/support">정부 지원 사업</a><a href="#/channels" class="on">팔 곳 연결</a></div><section><h2>팔 곳 연결</h2><p class="small">앱에 등록한 매장·쇼핑몰과 주요 판로예요. 등록한 곳에는 제안이 바로 가고, 주요 판로는 운영자가 입점을 이어 드려요. 비용은 바뀔 수 있어요. 확인일 ${CHECKED}.</p>${S.profile&&has('channel')?'<a class="btn w s" href="#/new/channel">내 팔 곳 정보 고치기</a>':'<a class="btn w s" href="#/new/channel">내 매장·쇼핑몰 등록하기</a>'}</section>
  <section><div class="sec-t">앱에 등록한 팔 곳</div><div id="chU"><div class="loading">불러오는 중…</div></div></section>
  <section><div class="sec-t">주요 판로 ${ROUTES.length}곳</div><div class="chips" id="rtF"></div><div id="chR" style="margin-top:10px"></div></section>${beta()}`;
  sub(onSnapshot(query(collection(db,'channels'), limit(200)), snap=>{ const el=document.getElementById('chU'); if(!el) return; const list=snap.docs.map(d=>({id:d.id,...d.data()})); el.innerHTML=list.length? list.map(channelCard).join('') : '<div class="empty">아직 등록한 곳이 없어요.</div>'; bindPropose(el); }));
  const types=[...new Set(ROUTES.map(r=>r.type).filter(Boolean))]; let rt='';
  const drawR=()=>{ document.getElementById('rtF').innerHTML=`<button class="chip ${rt===''?'on':''}" data-t="">전체</button>`+types.map(t=>`<button class="chip ${rt===t?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join(''); const el=document.getElementById('chR'); el.innerHTML=ROUTES.filter(r=>!rt||r.type===rt).map(routeCard).join(''); bindPropose(el); };
  document.getElementById('rtF').onclick=e=>{ const b=e.target.closest('[data-t]'); if(!b) return; rt=b.dataset.t; drawR(); };
  drawR();
}

function viewDoor(k){
  const d=DOORS[k]; if(!d){ location.hash='#/home'; return; }
  const mine=S.profile&&has(k);
  let html=`<a class="small" href="#/home" style="display:inline-block;margin-top:14px;text-decoration:none">← 홈</a><section><div class="kick">${d.s}</div><h1>${d.n}</h1><p class="sub">${d.d}</p>${S.profile?(mine?'<span class="pill o">내 문</span>':'<button class="btn w s" id="addDoor">이 문 열기</button>'):'<a class="btn o full" href="#/start">시작하기</a>'}</section>`;
  html+=benefitBox(k);
  if(k==='invest'){ V().innerHTML=html+investBody(); bindInvest(); bindAddBtn(k); return; }
  const info=DOOR_INFO[k];
  html+=`<section><div class="sec-t">이렇게 이어져요</div><div class="steps">${info.steps.map(s=>`<div>${esc(s)}</div>`).join('')}</div></section>`;
  if(S.profile) html+=`<a class="btn o full" href="${info.cta[1]}">${info.cta[0]}</a>`;
  html+=`<section><div class="sec-t">${info.list}</div><div id="dList"><div class="loading">불러오는 중…</div></div></section>`;
  if(k==='sell'||k==='channel') html+=`<a class="btn w full" href="#/channels">팔 곳 연결 보기</a>`;
  html+=`<section><div class="sec-t">이 문에 맞는 정부 지원 사업</div><div id="dSup"></div><a class="btn w full" href="#/support?door=${k}" style="margin-top:10px">지원 사업 더 보기</a></section>${beta()}`;
  V().innerHTML=html; bindAddBtn(k);
  const ds=document.getElementById('dSup'); const sl=supList(k).slice(0,3); ds.innerHTML=sl.length? sl.map(supCard).join('') : '<div class="empty">이 문에 맞는 사업을 찾는 중이에요. 전체 목록을 봐 주세요.</div>'; bindSup(ds);
  const L=()=>document.getElementById('dList');
  if(k==='make'||k==='buy'||k==='channel'||k==='partner'){
    sub(onSnapshot(query(collection(db,'editions'), orderBy('createdAt','desc'), limit(60)), snap=>{ const el=L(); if(!el) return; const list=snap.docs.map(x=>({id:x.id,...x.data()})).filter(e=>e.status==='pre'); if(k==='partner'){ el.dataset.eds=list.length; } const htmlE=list.map(e=>edCard(e)+(k==='channel'?proposeBtn('edition',e):'')+(k==='partner'&&S.profile&&has('partner')&&e.ownerId!==S.user.uid?`<div style="margin:8px 0 12px"><button class="btn s" data-elink="${e.id}">이 에디션 팔아 주기 (10%, 가정)</button></div>`:'')).join(''); if(k==='partner'){ const box=document.getElementById('dListE'); if(box) box.innerHTML=htmlE||'<div class="empty">선주문 중인 에디션이 없어요.</div>'; } else el.innerHTML=htmlE||'<div class="empty">아직 없어요.</div>'; bindPropose(el); el.querySelectorAll('[data-elink]').forEach(b=>b.onclick=()=>copyLink('에디션 판매 링크', location.origin+location.pathname+'#/p/'+b.dataset.elink+'/'+S.user.uid, '판매 링크를 복사했어요')); }));
  }
  if(k==='partner'||k==='sell'){
    if(k==='partner') L().innerHTML='<div id="dListO"><div class="loading">불러오는 중…</div></div><div class="sec-t" style="margin-top:16px">팔 수 있는 에디션 (판매액의 10%, 가정)</div><div id="dListE"></div>';
    sub(onSnapshot(query(collection(db,'offers'), orderBy('createdAt','desc'), limit(30)), snap=>{ const box=document.getElementById(k==='partner'?'dListO':'dList'); if(!box) return; const list=snap.docs.map(x=>({id:x.id,...x.data()})); box.innerHTML=list.length? list.map(offerCard).join('') : '<div class="empty">등록된 상품이 아직 없어요.</div>'; bindOfferButtons(box); }));
  }
  if(k==='factory'){
    sub(onSnapshot(query(collection(db,'wishes'), orderBy('votes','desc'), limit(20)), snap=>{ const el=L(); if(!el) return; const list=snap.docs.map(x=>({id:x.id,...x.data()})); el.innerHTML=list.length? list.map(wishCard).join('') : '<div class="empty">아직 요청이 없어요.</div>'; bindWish(el); }, ()=>{}));
  }
  if(k==='buy'){
    const sec=document.createElement('section'); sec.innerHTML='<div class="sec-t">만들어 주세요 요청</div><div id="dWish"><div class="loading">불러오는 중…</div></div>'; L().parentNode.after(sec);
    sub(onSnapshot(query(collection(db,'wishes'), orderBy('votes','desc'), limit(20)), snap=>{ const el=document.getElementById('dWish'); if(!el) return; const list=snap.docs.map(x=>({id:x.id,...x.data()})); el.innerHTML=list.length? list.map(wishCard).join('') : '<div class="empty">아직 요청이 없어요.</div>'; bindWish(el); }, ()=>{}));
  }
}
function bindAddBtn(k){ const b=document.getElementById('addDoor'); if(b) b.onclick=()=>addDoor(k).catch(e=>toast('실패: '+e.message)); }

function investBody(){
  return `<section><div class="sec-t">투자 현황판 (실시간)</div><div class="kpi" id="ivK"><div class="loading">계산 중…</div></div></section>
  <section><div class="sec-t">생산 자금이 필요한 에디션</div><p class="tiny">선주문 대금은 받는 사람이 배송을 확인한 뒤 정산돼요. 그 전에 공장에 줄 생산비(착수금·잔금)를 투자자가 채워요. 필요 자금 = 목표 수량 × 생산 단가(가정). 모인 금액은 투자 의향의 합계예요.</p><div id="ivE"><div class="loading">불러오는 중…</div></div></section>
  <section><div class="sec-t">회사(플랫폼)에 투자</div><div class="card small"><b style="color:var(--ink)">돈 버는 방법 (가정)</b><br>· 에디션 판매 이익: 1개당 판매가의 약 30~35% (부가세 반영, 헤어 오일 3,000~5,000개 묶음 생산 기준)<br>· 성과형 판매 수수료 5%, 공장 슬롯 수수료 3%<br>· 손익분기: 월 고정비 3,000만 원이면 헤어 오일 월 약 4,400개<div style="margin-top:12px"><button class="btn o full" id="ivCo">회사 투자 의향 남기기</button></div></div></section>
  <section><div class="note"><b>꼭 알아 두세요</b><br>시험판은 투자 의향만 받아요. 돈을 받지 않고 수익을 약속하지 않아요. 실제 투자 모집은 법에 맞는 방식(증권형 크라우드펀딩 중개업체를 통한 모집, 소수 투자자 대상 사모 등)으로 법률 검토를 마친 뒤에만 해요.</div></section>${beta()}`;
}
function bindInvest(){
  const co=document.getElementById('ivCo'); if(co) co.onclick=()=>investSheet(null);
  let EDS=[], SLOTS={}, OFS=[], FAC=0, CH=0;
  const draw=()=>{
    const k=document.getElementById('ivK'); if(!k) return;
    const gmv=EDS.reduce((s,e)=>s+(e.sold||0)*e.price,0), ach=EDS.filter(e=>(e.sold||0)>=e.goal).length, mk=EDS.filter(e=>['making','shipped'].includes(e.status)).length, ofs=OFS.reduce((s,o)=>s+(o.sold||0)*o.price,0), pledged=EDS.reduce((s,e)=>s+(e.fundPledged||0),0);
    k.innerHTML=[['누적 선주문액',man(gmv)],['목표 달성 에디션',ach+' / '+EDS.length+'개'],['생산·발송 중',mk+'개'],['성과형 판매액',man(ofs)],['공장 · 팔 곳',FAC+'곳 · '+(CH+ROUTES.length)+'곳'],['모인 생산 자금 의향',man(pledged)]].map(x=>`<div class="card"><div class="tiny">${x[0]}</div><b>${x[1]}</b></div>`).join('');
    const el=document.getElementById('ivE'); if(!el) return;
    const list=EDS.filter(e=>e.status==='pre'||e.status==='closed').sort((a,b)=>(b.sold||0)/b.goal-(a.sold||0)/a.goal);
    el.innerHTML = list.length ? list.map(e=>{ const unit=e.slotId&&SLOTS[e.slotId]?SLOTS[e.slotId].unitCost:null; const need=needFund(e,unit), got=e.fundPledged||0, pct=need?Math.min(100,Math.round(got/need*100)):0; return `<div class="card"><a class="ed" href="#/p/${e.id}"><div class="th">${artFor(e)}</div><div class="meta">${statusPill(e)}<div class="t" style="margin-top:5px">${esc(e.title)} ${P(e.product).name}</div><div class="tiny">${esc(e.handle||'')} · 선주문 ${e.sold||0}/${e.goal}개 (${Math.round((e.sold||0)/e.goal*100)}%)</div></div></a><div class="row between small" style="margin-top:10px"><span>필요 생산 자금 <b style="color:var(--ink)">${man(need)}</b></span><span>모인 의향 <b style="color:var(--ink)">${man(got)}</b>${got>=need&&need?' (다 모임)':''}</span></div><div class="bar g"><i style="width:${pct}%"></i></div><button class="btn s full" data-inv="${e.id}" style="margin-top:8px">생산 자금 의향 넣기</button></div>`; }).join('') : '<div class="empty">지금 자금이 필요한 에디션이 없어요.</div>';
    el.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>investSheet(EDS.find(x=>x.id===b.dataset.inv)));
  };
  sub(onSnapshot(query(collection(db,'editions'), orderBy('createdAt','desc'), limit(200)), s=>{ EDS=s.docs.map(d=>({id:d.id,...d.data()})); draw(); }));
  sub(onSnapshot(query(collection(db,'slots'), limit(200)), s=>{ SLOTS={}; s.docs.forEach(d=>{ SLOTS[d.id]=d.data(); }); draw(); }));
  sub(onSnapshot(query(collection(db,'offers'), limit(200)), s=>{ OFS=s.docs.map(d=>d.data()); draw(); }));
  sub(onSnapshot(query(collection(db,'factories'), limit(200)), s=>{ FAC=s.size; draw(); }));
  sub(onSnapshot(query(collection(db,'channels'), limit(200)), s=>{ CH=s.size; draw(); }));
}
function investSheet(e){
  if(!S.profile){ location.hash='#/start'; return; }
  if(!has('invest')){ sheet(`<h3>투자하고 싶어요 문을 먼저 열어 주세요</h3><p class="small">문을 열면 투자 의향을 남길 수 있어요.</p><button class="btn o full" id="isAdd">이 문 열기</button>`); document.getElementById('isAdd').onclick=()=>addDoor('invest').catch(err=>toast('실패: '+err.message)); return; }
  const amts=[10,50,100,300,500,1000,3000,5000];
  sheet(`<h3>${e?'생산 자금 의향':'회사 투자 의향'}</h3><div class="small" style="margin-bottom:8px">${e? esc(e.title)+' '+P(e.product).name : '에디션(가칭) 플랫폼 회사'}</div><label class="field"><span>금액</span><select id="ivA">${amts.map(a=>`<option value="${a*10000}">${a.toLocaleString('ko-KR')}만 원</option>`).join('')}</select></label><label class="field"><span>투자자 유형</span><select id="ivT">${INV_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></label><label class="field"><span>메모 (60자, 연락처는 넣지 마세요)</span><input id="ivM" maxlength="60"></label><div class="note" style="margin:10px 0">의향일 뿐 약정이 아니에요. 돈을 받지 않고 수익을 약속하지 않아요. 실제 투자는 법률 검토 뒤 별도 계약으로만 해요.</div><button class="btn o full" id="ivOk">의향 남기기</button><button class="btn w full" id="ivX" style="margin-top:8px">닫기</button>`);
  document.getElementById('ivX').onclick=closeSheet;
  document.getElementById('ivOk').onclick=async()=>{
    const amount=parseInt(document.getElementById('ivA').value,10); const btn=document.getElementById('ivOk'); btn.disabled=true;
    const base={ uid:S.user.uid, nick:S.profile.name, amount, investorType:document.getElementById('ivT').value, memo:document.getElementById('ivM').value.trim(), status:'new', createdAt:serverTimestamp() };
    try{
      if(e){ const ref=doc(collection(db,'investIntents')); const bt=writeBatch(db); bt.set(ref,{...base, kind:'edition', editionId:e.id, editionTitle:e.title}); bt.update(doc(db,'editions',e.id),{ fundPledged:increment(amount), lastIntentId:ref.id }); await bt.commit(); }
      else { await addDoc(collection(db,'investIntents'),{...base, kind:'company', editionId:'', editionTitle:''}); }
      closeSheet(); toast('의향을 남겼어요');
    }catch(err){ btn.disabled=false; toast('실패: '+err.message); }
  };
}

/* ---------- 에디션 페이지 ---------- */
function viewEdition(id, partner){
  if(partner) sessionStorage.setItem('ref_'+id, partner);
  V().innerHTML='<div class="loading">불러오는 중…</div>';
  sub(onSnapshot(doc(db,'editions',id), async d=>{
    if(!d.exists()){ V().innerHTML='<div class="empty" style="margin-top:30px">찾을 수 없는 에디션이에요.</div>'; return; }
    const e={id:d.id,...d.data()}, p=P(e.product), s=e.sold||0, pct=Math.min(100,Math.round(s/e.goal*100)), left=Math.max(0,e.goal-s);
    const steps=[['샘플 승인','prep'],['선주문','pre'],['마감·생산 대기','closed'],['생산','making'],['발송','shipped']];
    const idx=Math.max(0, steps.findIndex(x=>x[1]===e.status));
    const uid=S.user?S.user.uid:'';
    const showInv=(S.profile&&has('invest'))||S.isAdmin, showPart=S.profile&&has('partner')&&e.status==='pre'&&e.ownerId!==uid;
    V().innerHTML=`<a class="small" href="#/home" style="display:inline-block;margin-top:14px;text-decoration:none">← 홈</a>
    <div class="preview" style="margin-top:8px">${artFor(e)}</div>
    <section>${statusPill(e)}<h2 style="margin:8px 0 2px">${esc(e.title)} ${p.name}</h2><div class="small">${esc(e.handle||e.ownerName)} 에디션 · ${p.size} · ${esc(O(p,e.opt).n)}</div><div style="font-size:26px;font-weight:900;margin-top:8px">${won(e.price)}</div></section>
    <div class="card"><div class="row between"><b>${s}개 주문</b><span class="small">목표 ${e.goal}개</span></div><div class="bar${s>=e.goal?' g':''}" style="height:11px"><i style="width:${pct}%"></i></div><div class="small">${e.status==='prep' ? '크리에이터가 최종 샘플을 승인하면 2주 선주문이 열려요.' : e.status==='cancelled' ? '선주문 전에 해지된 에디션이에요.' : e.status==='pre' ? (left>0?`<b class="ac">${left}개</b> 더 모이면 생산을 시작해요. `:'목표를 넘었어요. 마감까지 계속 받아요. ')+'목표를 못 채우면 <b>전액 환불</b>돼요.' : e.status==='refunded' ? '목표를 채우지 못해 모든 주문이 환불돼요.' : e.status==='shipped' ? '생산을 마치고 발송했어요.' : '선주문을 마감했어요. '+(e.status==='making'?'지금 생산 중이에요.':'공장 배정 뒤 생산을 시작해요.')}</div></div>
    <div class="card small" style="margin-top:10px"><b style="color:var(--ink)">구매자 약속</b> · 목표 미달이면 자동 전액 환불 · 크리에이터가 샘플·출고를 직접 승인 · 30일 품질 보증 (교환·환불) · 약속일보다 7일 넘게 늦으면 10% 환불 (예정) · 한정판 번호 라벨 (예정)</div>
    ${showInv?`<div class="card" id="fundBox"><div class="row between"><b>생산 자금</b><span class="pill b">투자자에게만 보여요</span></div><div class="small" id="fundTxt">계산 중…</div><div class="bar g"><i id="fundBar" style="width:0%"></i></div>${(e.status==='pre'||e.status==='closed')?'<button class="btn s full" id="fundBtn" style="margin-top:8px">생산 자금 의향 넣기</button>':''}</div>`:''}
    ${showPart?`<div class="card"><b>이 에디션 팔아 주기</b><div class="small">내 링크로 팔리면 판매액의 10%를 받아요 (가정).</div><button class="btn s full" id="partBtn" style="margin-top:8px">내 판매 링크 복사</button></div>`:''}
    <section><div class="sec-t">진행 순서</div><div class="tl">${steps.map((x,i)=>`<div class="s ${i<idx?'done':i===idx?'now':''}"><b>${x[0]}</b><span>${x[1]==='prep'?(e.status==='prep'?'품질 관문 ①~③':'완료'):x[1]==='pre'?(e.status==='pre'?dleft(e)+' · 목표 '+e.goal+'개':(i<idx?'완료':'')):x[1]==='making'?p.weeks:''}</span></div>`).join('')}</div></section>
    ${qualityTrack(e)}${(e.ownerId===uid||S.isAdmin)?`<a class="btn w full" href="#/ed/${e.id}" style="margin-top:4px">관리 · 품질 관문·판매·정산·장부</a>`:''}
    <section><div class="sec-t">누가 만드나요</div><div class="card small"><b style="color:var(--ink)">기획</b> ${esc(e.handle||e.ownerName)} (판매 수익의 일부를 받아요)<br><b style="color:var(--ink)">판매·품질 책임</b> 에디션(가칭)<br><b style="color:var(--ink)">제조</b> <span id="facName">${e.slotId?'불러오는 중…':'협력 공장 (배정되면 표시)'}</span></div>${proposeBtn('edition',e)}</section>
    <div class="row" style="margin:10px 0 80px"><button class="btn w full" id="share">공유하기</button></div>
    ${e.status==='pre'?`<div class="sticky-cta"><div class="in"><button class="btn o full" id="buy">선주문하기 (시험) · ${won(e.price)}</button></div></div>`:''}${beta()}`;
    bindPropose(V());
    document.getElementById('share').onclick=async()=>{ const url=location.origin+location.pathname+'#/p/'+e.id; if(navigator.share){ try{ await navigator.share({title:e.title+' '+p.name, url}); }catch(x){} } else copyLink('에디션 링크', url, '링크를 복사했어요'); };
    const pb=document.getElementById('partBtn'); if(pb) pb.onclick=()=>copyLink('에디션 판매 링크', location.origin+location.pathname+'#/p/'+e.id+'/'+uid, '판매 링크를 복사했어요');
    const fbn=document.getElementById('fundBtn'); if(fbn) fbn.onclick=()=>investSheet(e);
    const b=document.getElementById('buy'); if(b) b.onclick=()=>buySheet(e);
    let unit=null;
    if(e.slotId){ try{ const sd=await getDoc(doc(db,'slots',e.slotId)); const f=document.getElementById('facName'); if(sd.exists()){ unit=sd.data().unitCost; if(f) f.textContent=sd.data().factoryName+' · '+sd.data().week+' 생산'; } else if(f) f.textContent='협력 공장'; }catch(x){} }
    if(showInv){ const need=needFund(e,unit), got=e.fundPledged||0; const t=document.getElementById('fundTxt'), br=document.getElementById('fundBar'); if(t) t.innerHTML=`정산 전까지 필요한 생산비 ${man(need)} (단가 ${unit?'공장 슬롯 기준':'가정'}) · 모인 의향 <b style="color:var(--ink)">${man(got)}</b>${got>=need&&need?' · 다 모였어요':''}`; if(br) br.style.width=(need?Math.min(100,Math.round(got/need*100)):0)+'%'; }
  }));
}
function buySheet(e){
  if(!S.profile){ toast('먼저 내 문을 골라 주세요 (사고 싶어요)'); location.hash='#/start'; return; }
  let qty=1; const partnerId=sessionStorage.getItem('ref_'+e.id)||'';
  function draw(){ sheet(`<h3>선주문 (시험)</h3><div class="small" style="margin-bottom:10px">${esc(e.title)} ${P(e.product).name}${partnerId?' · 판매 파트너 링크로 들어왔어요':''}</div><label class="field"><span>주문자 닉네임 (실명·연락처 넣지 마세요)</span><input id="bNick" maxlength="20" value="${esc((S.profile&&S.profile.name)||'')}"></label><div class="row between"><div class="qty"><button id="qm">−</button><b>${qty}</b><button id="qp">+</button></div><div style="font-size:22px;font-weight:900">${won(e.price*qty)}</div></div><div class="note" style="margin:12px 0">시험판이라 실제 결제는 되지 않아요. 주문 수만 올라가요.</div><button class="btn o full" id="bOk">시험 주문 넣기</button><button class="btn w full" id="bX" style="margin-top:8px">닫기</button>`);
    document.getElementById('qm').onclick=()=>{ qty=Math.max(1,qty-1); draw(); };
    document.getElementById('qp').onclick=()=>{ qty=Math.min(10,qty+1); draw(); };
    document.getElementById('bX').onclick=closeSheet;
    document.getElementById('bOk').onclick=async()=>{ const nick=document.getElementById('bNick').value.trim()||'익명'; const btn=document.getElementById('bOk'); btn.disabled=true; btn.textContent='저장 중…';
      try{ const pref=doc(collection(db,'preorders')); const bt=writeBatch(db); bt.set(pref,{ uid:S.user.uid, editionId:e.id, nick, qty, amount:e.price*qty, partnerId: partnerId===S.user.uid?'':partnerId, status:'test', createdAt:serverTimestamp() }); bt.update(doc(db,'editions',e.id),{ sold:increment(qty), lastOrderId:pref.id }); await bt.commit(); closeSheet(); toast(qty+'개 시험 주문 완료'); }catch(err){ btn.disabled=false; btn.textContent='시험 주문 넣기'; toast('주문 실패: '+err.message); } };
  }
  draw();
}

/* ---------- 만들기 ---------- */
function viewNew(kind, params){
  if(!kind){
    const acts=[['edition','에디션 만들기','make','내 이름 건 제품, 선주문 2주'],['wish','만들어 주세요 요청','buy','원하는 제품을 요청하고 공감 받기'],['offer','상품 올리기','sell','판매 파트너가 대신 팔아요'],['slot','생산 슬롯 열기','factory','빈 생산 일정을 열어요'],['channel','팔 곳 등록','channel','매장·쇼핑몰·바이어'],['invest','회사 투자 의향','invest','플랫폼 회사에 투자 의향 남기기']];
    V().innerHTML=`<section><div class="kick">만들기</div><h2>무엇을 올릴까요?</h2></section>${acts.map(a=>`<a class="card ed" href="#/new/${a[0]}" style="margin-bottom:10px"><div class="ib">${icon(a[2])}</div><div class="meta"><div class="t">${a[1]}${S.profile&&has(a[2])?' <span class="pill o">내 문</span>':''}</div><div class="tiny">${a[3]}</div></div></a>`).join('')}${beta()}`;
    return;
  }
  if(kind==='edition') return makeEdition(params.get('wish'));
  if(kind==='offer') return makeOffer();
  if(kind==='slot') return makeSlot();
  if(kind==='wish') return makeWish();
  if(kind==='channel') return makeChannel();
  if(kind==='invest'){ location.hash='#/door/invest'; setTimeout(()=>investSheet(null), 400); return; }
  location.hash='#/new';
}
function makeEdition(wishId){
  if(gate('make')) return;
  const d={product:'mist', opt:'glow', title:'MY EDITION', price:18900, goal:200, wishId:'', ctype:'basic', agree:false};
  const handle=S.profile.handle||('@'+String(S.profile.name||'me').replace(/\s+/g,'_'));
  function html(){ const p=P(d.product), o=O(p,d.opt); if(d.goal<p.min) d.goal=p.min;
    return `<section><div class="kick">내 에디션 만들기</div><h2>고르고, 조건을 정하고,<br>샘플을 승인하면 선주문을 열어요.</h2>${d.wishId?'<div class="note">만들어 주세요 요청에서 시작했어요.</div>':''}</section>
    <div class="preview" id="pv">${art(p.type,o.c,d.title,handle)}</div>
    <section><div class="sec-t">1. 기본 제품</div><div class="tiles" id="tl">${PRODUCTS.map(x=>`<button class="tile ${x.id===p.id?'on':''}" data-p="${x.id}">${art(x.type,x.opts[0].c,'','')}${x.name}</button>`).join('')}</div><p class="tiny" style="margin-top:6px">최소 ${p.min}개 · 마감 후 ${p.weeks}</p></section>
    <section><div class="sec-t">2. ${p.optLabel}</div><div class="sw" id="sw">${p.opts.map(x=>`<button class="swb ${x.k===o.k?'on':''}" data-o="${x.k}"><i style="background:${x.c}"></i>${x.n}</button>`).join('')}</div></section>
    <section><label class="field"><span>에디션 이름 (12자까지)</span><input id="fT" maxlength="12" value="${esc(d.title)}"></label>
    <div class="card"><div class="row between small"><b style="color:var(--ink)">판매가</b><b id="mp" style="color:var(--ink)">${won(d.price)}</b></div><input type="range" id="fP" min="${p.lo}" max="${p.hi}" step="500" value="${d.price}" style="width:100%;accent-color:#E4572E">
    <div class="row between small" style="margin-top:8px"><b style="color:var(--ink)">목표 수량</b><b id="mg" style="color:var(--ink)">${d.goal}개</b></div><input type="range" id="fG" min="${p.min}" max="${Math.max(p.min*5,3000)}" step="${p.min>=200?10:5}" value="${d.goal}" style="width:100%;accent-color:#E4572E"></div></section>
    <section><div class="row between"><div class="sec-t" style="margin:0">3. 계약 방식</div><a class="small" href="#/terms">표준 조건표 보기</a></div><div id="ctl" style="margin-top:8px">${Object.entries(CT).map(([k,c])=>`<button class="card" data-ct="${k}" style="display:block;width:100%;text-align:left;cursor:pointer;${d.ctype===k?'border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset':''}"><div class="row between"><b>${d.ctype===k?'● ':'○ '}${c.n}</b><span class="pill">${c.s}</span></div><div class="small" style="margin-top:4px">${c.d}</div></button>`).join('')}</div></section>
    <div class="res" id="res"></div>
    <section><div class="card small"><b style="color:var(--ink)">품질 관문</b> 만들어도 바로 팔지 않아요. 사양서 → 1차 샘플 → 최종 샘플을 내가 승인해야 2주 선주문이 열리고, 출고도 내가 승인해야 시작돼요. 30일 품질 보증은 플랫폼이 책임져요.</div>
    <label class="small" style="display:flex;gap:8px;align-items:flex-start;margin-top:10px"><input type="checkbox" id="fAg" ${d.agree?'checked':''} style="margin-top:3px"> 표준 조건표 ${TERMS.version}과 조건 요약서 내용에 동의해요 (시험, 법적 효력 없음)</label>
    <button class="btn w full" id="mkSheet" style="margin-top:8px">조건 요약서 미리 보기</button>
    <button class="btn o full" id="mk" style="margin-top:8px">에디션 만들기 (샘플 승인 뒤 선주문)</button></section>${beta()}`;
  }
  function res(){ const el=document.getElementById('res'); if(!el) return; const bonus=d.ctype==='coinvest'?TERMS.coBonus:0, mine=tierPay(d.price,d.goal,bonus), ex=TERMS.ps*mine, need=reqQty(d.price,bonus), ok=d.ctype==='direct'||ex>=TERMS.minIncome; const mk=document.getElementById('mk'); if(mk){ mk.disabled=!ok; mk.textContent=ok?'에디션 만들기 (샘플 승인 뒤 선주문)':'기대 수익 1,000만 원 미만이라 만들 수 없어요'; }
    el.innerHTML = d.ctype==='direct' ? `<div class="tiny">직접 투자형은 매출에서 실비(영수증 그대로)와 운영 수수료(공급가 15%, 최소 200만 원)를 빼고 나머지 전부를 받아요</div><div class="big" style="font-size:22px">계산기로 확인</div><div class="tiny"><a href="#/terms" style="color:#fff">표준 조건표 · 내 몫 계산기</a> · 기대 수익 1,000만 원이 넘는지 꼭 확인해 주세요</div>` : `<div class="tiny">목표 ${d.goal}개를 채우면 내 몫 (${CT[d.ctype].n} · 구간 누진${bonus?' +5%p':''})</div><div class="big">${won(mine)}</div><div class="tiny">기대 수익(성공률 85%) ${won(ex)} · ${ok?'<b style="color:#7BE0A6">1,000만 원 기준 충족</b>':'<b style="color:#FFB4A0">1,000만 원 기준 미달</b> · 이 가격이면 '+(need===Infinity?'-':need.toLocaleString('ko-KR'))+'개 이상 필요'} · 실효 ${(mine/((d.price*d.goal)||1)*100).toFixed(1)}%</div>`; }
  function pv(){ const p=P(d.product); document.getElementById('pv').innerHTML=art(p.type,O(p,d.opt).c,d.title,handle); }
  function cur(){ return {title:(d.title||'MY EDITION').trim()||'MY EDITION', product:d.product, price:Math.round(d.price), goal:Math.round(d.goal)}; }
  function bind(){
    document.getElementById('tl').onclick=e=>{ const b=e.target.closest('[data-p]'); if(!b) return; const np=P(b.dataset.p); d.product=np.id; d.opt=np.opts[0].k; d.price=np.price; d.goal=np.min; V().innerHTML=html(); bind(); };
    document.getElementById('sw').onclick=e=>{ const b=e.target.closest('[data-o]'); if(!b) return; d.opt=b.dataset.o; document.querySelectorAll('.swb').forEach(x=>x.classList.toggle('on',x===b)); pv(); };
    document.getElementById('fT').oninput=e=>{ d.title=e.target.value||' '; pv(); };
    document.getElementById('fP').oninput=e=>{ d.price=+e.target.value; document.getElementById('mp').textContent=won(d.price); res(); };
    document.getElementById('fG').oninput=e=>{ d.goal=+e.target.value; document.getElementById('mg').textContent=d.goal+'개'; res(); };
    document.getElementById('ctl').onclick=e=>{ const b=e.target.closest('[data-ct]'); if(!b) return; d.ctype=b.dataset.ct; const y=window.scrollY; V().innerHTML=html(); bind(); window.scrollTo(0,y); };
    document.getElementById('fAg').onchange=e=>{ d.agree=e.target.checked; };
    document.getElementById('mkSheet').onclick=async()=>{ const c=cur(); sheet(termSheetHtml(c, d.ctype, await termsHash(c, d.ctype))); };

}

/* ---------- 섭외 후보 v2 (운영자 전용, 분석 카드 + 맞춤 제품) ---------- */
const PST = {new:'미연락', ok:'연락 승인', sent:'연락함', reply:'답장', call:'통화·미팅', signed:'계약', no:'거절', hold:'보류'};
const CATCOL = [[/향수|퍼퓸|오 드|오드|향/,'#E9D7F0'],[/헤어|샴푸|왁스|포마드|에센스|트리트먼트|빗/,'#F3E2C7'],[/스킨|토너|앰플|크림|세럼|선크림|선스틱|마스크|패드|클렌|화장품|밤/,'#DDEFF0'],[/립|틴트|쿠션|색조|아이섀도|블러셔/,'#F6D3D3'],[/양말|레깅스|요가|필라테스|러닝|운동|스트랩|밴드|매트|폼롤러|짐/,'#1F3A5F'],[/등산|캠핑|낚시|에기|루어|자전거|사이클|서핑|아웃도어|판초|담요/,'#2F5D50'],[/소스|양념|믹스|베이킹|쿠키|식품|간식|잼|시즈닝|그래놀라|스프레드/,'#B5432F'],[/반려|강아지|고양이|펫|하네스|리드|방석|장난감|스크래쳐/,'#E8C9A0'],[/스티커|마스킹|다이어리|노트|문구|펜|플래너|떡메/,'#F4E3A1'],[/셔츠|슬랙스|니트|후드|맨투맨|티셔츠|팬츠|바지|블라우스|자켓|코트|가디건|옷|모자|캡|원피스|데님|셋업/,'#3A3B40'],[/컵|머그|텀블러|보틀|물병|쉐이커/,'#9FB7C9'],[/앞치마|행주|주방|수세미|도마|주걱|칼/,'#D9C7A7'],[/가방|파우치|에코백|토트/,'#C9B8A0']];
function catColor(s){ for(const [re,c] of CATCOL){ if(re.test(s||'')) return c; } return '#EDE7DC'; }
function pkgArt(product, handle){
  const color=catColor(product), sh=shade(color,.82);
  const words=String(product||'').replace(/\(.*?\)/g,'').trim();
  const l1=words.slice(0,9), l2=words.slice(9,18);
  const f1=fit(l1||' ',92,13,7), f2=fit(l2||' ',92,12,7);
  return '<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg"><ellipse cx="100" cy="230" rx="70" ry="6" fill="#000" opacity=".08"/><rect x="34" y="30" width="132" height="192" rx="14" fill="'+color+'" stroke="'+sh+'" stroke-width="1.5"/><rect x="34" y="30" width="132" height="34" rx="14" fill="'+sh+'"/><rect x="34" y="50" width="132" height="14" fill="'+sh+'"/><rect x="48" y="84" width="104" height="116" rx="8" fill="#FFFDF8"/><text x="100" y="104" text-anchor="middle" font-size="7.5" fill="#9A958B" letter-spacing="2.5" font-weight="700">EDITION</text><text x="100" y="132" text-anchor="middle" font-size="'+f1+'" font-weight="900" fill="#15171C">'+esc(l1)+'</text>'+(l2?'<text x="100" y="150" text-anchor="middle" font-size="'+f2+'" font-weight="900" fill="#15171C">'+esc(l2)+'</text>':'')+'<text x="100" y="182" text-anchor="middle" font-size="8" fill="#5B606B">'+esc(handle||'')+'</text></svg>';
}
async function loadCRM(force){ if(S.crm && !force) return S.crm; const snap=await getDocs(collection(db,'prospects')); S.crm=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.no-b.no); return S.crm; }
function viewCRM(id){
  if(!S.isAdmin){ location.hash='#/admin'; return; }
  V().innerHTML='<div class="loading">불러오는 중…</div>';
  loadCRM().then(list=> id ? crmDetail(list,id) : crmList(list)).catch(err=>{ V().innerHTML='<div class="empty" style="margin-top:20px">불러오기 실패: '+esc(err.message)+'</div>'; });

function priPill(p){ return '<span class="pill '+(p==='A'?'o':p==='B'?'b':'')+'">'+p+'</span>'; }
function nf(n){ return (n||n===0)? Number(n).toLocaleString('ko-KR') : '-'; }
function crmList(list){
  const F = S.crmF || (S.crmF={seg:'',pri:'',st:'',q:''});
  const segs=[...new Set(list.map(x=>x.seg))];
  const draw=()=>{
    const q=(F.q||'').trim().toLowerCase();
    const rows=list.filter(x=>(!F.seg||x.seg===F.seg)&&(!F.pri||x.pri===F.pri)&&(!F.st||(x.status||'new')===F.st)&&(!q||(x.name+' '+(x.handle||'')+' '+((x.best||{}).product||'')).toLowerCase().includes(q)));

    <div class="chips" id="cSeg"><button class="chip ${F.seg===''?'on':''}" data-s="">전체</button>${segs.map(s=>`<button class="chip ${F.seg===s?'on':''}" data-s="${esc(s)}">${esc(s)} ${list.filter(x=>x.seg===s).length}</button>`).join('')}</div>
    <div class="row" style="margin:10px 0"><select id="cPri" class="adm"><option value="">우선순위 전체</option>${['A','B','C'].map(p=>`<option value="${p}" ${F.pri===p?'selected':''}>${p}</option>`).join('')}</select><select id="cSt" class="adm"><option value="">상태 전체</option>${Object.entries(PST).map(([k,v])=>`<option value="${k}" ${F.st===k?'selected':''}>${v}</option>`).join('')}</select><input id="cQ" placeholder="이름·제품 검색" value="${esc(F.q||'')}" style="flex:1;min-width:110px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px"></div>
    <div class="tiny" style="margin-bottom:6px">${rows.length}명 · 점수는 콘텐츠 적합·수요 근거·차별성·제작 쉬움·이익 (25점 만점)</div>
    <div>${rows.map(x=>{ const b=x.best||{}; return `<a class="card ed" href="#/crm/${x.id}" style="margin-bottom:8px"><div class="th">${pkgArt(b.product,x.handle)}</div><div class="meta"><div class="row" style="gap:6px">${priPill(x.pri)}${x.g10?`<span class="pill ${/^A|^B/.test(x.g10.verdict||'')?'g':''}">1,000만 ${esc((x.g10.verdict||'').slice(0,1))}</span>`:''}<span class="pill">${esc(PST[x.status||'new'])}</span><span class="tiny">${esc(x.seg)} · ${x.score||'-'}점</span></div><div class="t" style="margin-top:4px">${esc(x.name)}</div><div class="tiny">${esc(x.platform)} · ${esc(x.fText)}${x.an&&x.an.avgViews?' · 평균 조회 '+nf(x.an.avgViews):''}</div><div class="small" style="margin-top:3px"><b style="color:var(--ink)">${esc(b.product||'')}</b>${b.price?' · '+won(b.price):''}</div></div></a>`; }).join('')||'<div class="empty">조건에 맞는 사람이 없어요.</div>'}</div>`;
    document.getElementById('cSeg').onclick=e=>{ const b=e.target.closest('[data-s]'); if(!b) return; F.seg=b.dataset.s; draw(); };
    document.getElementById('cPri').onchange=e=>{ F.pri=e.target.value; draw(); };
    document.getElementById('cSt').onchange=e=>{ F.st=e.target.value; draw(); };
    document.getElementById('cQ').onchange=e=>{ F.q=e.target.value; draw(); };
  };
  draw();
}
function liList(arr){ return (arr&&arr.length)? '<ul style="margin:4px 0 0;padding-left:18px">'+arr.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>' : '-'; }

function fmtD(t){ const ms=tsMs(t); if(!ms) return '-'; const d=new Date(ms); return (d.getMonth()+1)+'.'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function tierPay(price, qty, bonus){ let left=Math.max(0,qty||0), prev=0, pay=0; for(const [cap,r] of TERMS.tiers){ const n=Math.min(left, cap-prev); if(n>0){ pay+=n*price*(r+(bonus||0)); left-=n; } prev=cap; if(left<=0) break; } return pay; }
function tierInfo(qty){ const q=qty||0; if(q<300) return {n:1, rate:0.15, next:300, nextRate:0.20}; if(q<1000) return {n:2, rate:0.20, next:1000, nextRate:0.25}; return {n:3, rate:0.25, next:0, nextRate:0}; }
function ctOf(e){ return ((e&&e.contract)||{}).type||'basic'; }
function ctBonus(e){ return (ctOf(e)==='coinvest'?TERMS.coBonus:0)+(e&&e.rerun?TERMS.rerun:0); }
function payoutOf(e, qty){ if(ctOf(e)==='direct') return null; return tierPay(e.price, qty==null?(e.sold||0):qty, ctBonus(e)); }
function gateSt(e,k){ const g=((e&&e.gates)||{})[k], a=((e&&e.approvals)||{})[k]; if(a && (!g || (a.at||0)>=(g.at||0))) return a.d==='ok'?'ok':'fix'; if(g && g.st==='review') return 'review'; return 'todo'; }

}
async function sha16(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16); }

function reqQty(price, bonus){ const target=TERMS.minIncome/TERMS.ps; let prev=0, acc=0; for(const [cap,r] of TERMS.tiers){ const rr=r+(bonus||0), seg=(cap-prev)*price*rr; if(acc+seg>=target) return Math.ceil(prev+(target-acc)/(price*rr)); acc+=seg; prev=cap; } return Infinity; }
const ADFEE=[['1만~5만','80만 원'],['5만~10만','240만 원'],['10만~50만','640만 원'],['50만~100만','1,600만 원'],['100만 이상','2,400만 원']];
/* 표준 조건표 · 몫 계산기 */
function calcTypes(x){
  const q=x.qty, sup=x.price/1.1*q, shipRev=3000/1.1*q, pg=(x.price+3000)*0.032*q, cogs=x.unit*q, ful=x.shipCost*q;
  const ret=q*(0.04*(x.shipCost+1100+0.5*x.unit)+0.02*(x.unit+x.shipCost)+300);
  const pool=sup+shipRev-pg-cogs-x.setup-x.photo-ful-ret, rb=x.rerun?TERMS.rerun:0, atRisk=x.setup*0.6+x.photo;
  const basic=tierPay(x.price,q,rb), co=tierPay(x.price,q,TERMS.coBonus+rb), fee=Math.max(TERMS.directFee*sup, TERMS.directMin);
  return { sup, pool, rows:[
    {k:'basic', creator:basic, invest:0, fail:0, plat:pool-basic},
    {k:'coinvest', creator:co, invest:TERMS.coShare*(cogs+x.setup+x.photo), fail:TERMS.coShare*atRisk, plat:pool-co},
    {k:'direct', creator:pool-fee, invest:cogs+x.setup+x.photo, fail:atRisk, plat:fee},
    {k:'external', creator:basic, invest:0, fail:0, plat:pool-basic}
  ]};
}

    <section><div class="sec-t">품질 관문 · 크리에이터 승인</div><div class="card" style="padding:4px 12px">${legacy?`<div class="small" style="padding:8px 0">이전 시험 에디션이라 품질 관문 기록이 없어요.${adm?' <button class="btn w s" id="mInit">품질 관문 시작</button>':''}</div>`:gateRows}</div>${openBox}</section>
    <section><div class="sec-t">정산</div><div class="card small"><div>정산 예정일: <b style="color:var(--ink)">${due?fmtD(due).split(' ')[0]+' (발송 후 '+TERMS.settleDays+'일)':'발송 완료 후 '+TERMS.settleDays+'일 안'}</b></div><div>지급된 금액: <b style="color:var(--ink)">${won(paid)}</b>${lateDays?` · <b style="color:#B5432F">${lateDays}일 늦음 → 지연이자 ${won(lateInt)} (연 ${TERMS.lateRate*100}%, 자동 계산)</b>`:''}</div>${SET.length?'<div style="margin-top:6px">'+SET.map(s=>`<div class="tiny">${fmtD(s.at)} · ${s.paid?'지급':'예정'} ${won(s.amount)}${s.note?' · '+esc(s.note):''}</div>`).join('')+'</div>':''}</div>${adm?'<button class="btn w full" id="mSet" style="margin-top:8px">정산 기록 추가 (운영자)</button>':''}</section>
    <section><div class="sec-t">계약</div><div class="card"><div class="row between"><b>${c.n}</b><span class="pill">${c.s}</span></div><div class="small" style="margin-top:4px">${c.d}</div><div class="tiny" style="margin-top:6px">표준 조건표 ${esc((e.contract||{}).version||'-')} · 동의 ${fmtD((e.contract||{}).agreedAt)}${(e.contract||{}).agreedBy?' · '+esc(e.contract.agreedBy):''}</div><div class="tiny" id="hashBox">조건 지문 확인 중…</div><button class="btn w s" id="mSheet" style="margin-top:8px">조건 요약서 보기</button></div></section>
    <section><div class="sec-t">원가 공개 장부</div><div class="card" style="padding:4px 12px">${LED.length?`<table><tr><th>항목</th><th class="r">금액</th></tr>${LED.map(l=>`<tr><td>${esc(l.kind)}${l.vendor?' · '+esc(l.vendor):''}<div class="tiny">${esc(l.note||'')}${l.url?` · <a href="${esc(l.url)}" target="_blank" rel="noopener">증빙</a>`:''} · ${fmtD(l.at)}</div></td><td class="r">${won(l.amount)}</td></tr>`).join('')}<tr><td><b>합계 (부가세 별도)</b></td><td class="r"><b>${won(ledSum)}</b></td></tr></table>`:'<div class="small" style="padding:8px 0">아직 올라온 원가 자료가 없어요. 견적서·세금계산서·검사 보고서가 생기면 여기에 올라와요.</div>'}</div>${adm?'<button class="btn w full" id="mLed" style="margin-top:8px">원가 항목 추가 (운영자)</button>':''}</section>
    <section><div class="sec-t">요청</div>${mine?`<div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn w s" data-rq="audit">장부 열람 요청</button><button class="btn w s" data-rq="question">질문하기</button>${e.status==='prep'?'<button class="btn w s" data-rq="terminate">선주문 전 해지</button>':''}</div>`:''}<div style="margin-top:8px">${REQ.length?REQ.map(r=>`<div class="card small"><div class="row between"><b style="color:var(--ink)">${RTYPES[r.type]||esc(r.type)}</b><span class="pill ${r.status==='done'?'g':'o'}">${r.status==='done'?'답변 완료':'접수'}</span></div>${r.note?'<div>'+esc(r.note)+'</div>':''}${r.answer?'<div class="tiny" style="margin-top:4px">답변: '+esc(r.answer)+'</div>':''}<div class="tiny">${fmtD(r.createdAt)}</div>${adm&&r.status!=='done'?`<button class="btn w s" data-an="${r.id}" style="margin-top:6px">답변하기 (운영자)</button>`:''}</div>`).join(''):'<div class="small">요청이 없어요. 장부 열람은 에디션마다 1번, 비용 없이 할 수 있어요.</div>'}</div></section>
    ${adm?`<section><div class="sec-t">운영자 · 진행 단계</div><div class="row" style="gap:6px;flex-wrap:wrap">${[['closed','마감'],['making','생산 중'],['shipped','발송 완료'],['refunded','미달 환불']].map(([k,n])=>`<button class="btn w s" data-stt="${k}">${n}</button>`).join('')}</div><div class="tiny" style="margin-top:4px">발송 완료는 ⑤ 출고 승인 뒤에만 돼요.</div></section>`:''}
    <section><div class="sec-t">변경 이력 (지울 수 없어요)</div><div class="card small">${LOG.length?LOG.map(l=>`<div style="padding:3px 0">${fmtD(l.at)} · <b style="color:var(--ink)">${esc(l.who||'')}</b> ${esc(l.what||'')}</div>`).join(''):'기록이 없어요.'}</div></section>${beta()}`;
    bindM(e, mine, adm);
    termsHash(e, ct).then(h=>{ const hb=document.getElementById('hashBox'); if(!hb) return; const st=(e.contract||{}).hash; hb.innerHTML = !st ? `조건 지문 ${h} · 이전 시험 에디션이라 동의 기록이 없어요` : st===h ? `조건 지문 <b>${h}</b> · 계약 때와 같아요` : `<b style="color:#B5432F">조건 지문이 계약 때(${esc(st)})와 달라요 (지금 ${h})</b> · 판매가·목표·조건표가 바뀌었는지 확인하세요${mine&&e.status==='prep'?' <button class="btn w s" id="mReAg">바뀐 조건에 다시 동의</button>':''}`; const ra=document.getElementById('mReAg'); if(ra) ra.onclick=async()=>{ try{ await updateDoc(ed(),{contract:{...(e.contract||{}), version:TERMS.version, hash:h, agreedAt:Date.now()}}); logE(id,'바뀐 조건에 다시 동의 (지문 '+h+')'); toast('다시 동의했어요'); }catch(err){ toast('실패: '+err.message); } }; }).catch(()=>{});
  };
  const bindM=(e, mine, adm)=>{
    const q=s=>document.querySelectorAll(s);
    q('[data-ap]').forEach(b=>b.onclick=()=>decide(b.dataset.ap,'ok'));
    q('[data-fx]').forEach(b=>b.onclick=()=>decide(b.dataset.fx,'fix'));
    q('[data-ev]').forEach(b=>b.onclick=()=>evSheet(b.dataset.ev));
    q('[data-rq]').forEach(b=>b.onclick=()=>reqSheet(b.dataset.rq));
    q('[data-an]').forEach(b=>b.onclick=()=>ansSheet(b.dataset.an));
    q('[data-stt]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.stt; if(k==='shipped' && gateSt(e,'ship')!=='ok' && e.gates){ toast('⑤ 출고 승인 전에는 발송 처리할 수 없어요'); return; } try{ await updateDoc(ed(), k==='shipped'?{status:k, shippedAt:Date.now()}:{status:k}); logE(id,'진행 단계 → '+(STATUS[k]||[k])[0]); toast('바꿨어요'); }catch(err){ toast('실패: '+err.message); } });
    const g=i=>document.getElementById(i);
    if(g('mOpen')) g('mOpen').onclick=async()=>{ g('mOpen').disabled=true; try{ await updateDoc(ed(),{status:'pre', deadline:Date.now()+14*86400000, openedAt:Date.now()}); logE(id,'최종 샘플 승인 뒤 선주문 열기 (2주)'); toast('선주문을 열었어요'); }catch(err){ g('mOpen').disabled=false; toast('실패: '+err.message); } };
    if(g('mInit')) g('mInit').onclick=async()=>{ try{ await updateDoc(ed(),{gates:Object.fromEntries(GATES.map(([k])=>[k,{st:'todo'}])), approvals:{}}); logE(id,'품질 관문 시작'); }catch(err){ toast('실패: '+err.message); } };
    if(g('mSheet')) g('mSheet').onclick=async()=>{ sheet(termSheetHtml(e, ctOf(e), (e.contract||{}).hash||await termsHash(e, ctOf(e)))); };
    if(g('mLed')) g('mLed').onclick=ledSheet;
    if(g('mSet')) g('mSet').onclick=setSheet;
  };
  function decide(k, d){ const n=GATES.find(x=>x[0]===k)[1];
    sheet(`<h3>${n} ${d==='ok'?'승인':'수정 요청'}</h3><p class="small">${d==='ok'?'승인하면 다음 단계로 넘어가요. 승인 기록은 지울 수 없어요.':'무엇을 고쳐야 하는지 적어 주세요. 운영자가 고친 뒤 다시 확인을 요청해요.'}</p><label class="field"><span>${d==='ok'?'메모 (선택)':'고칠 점'}</span><textarea id="dcN" rows="3"></textarea></label><button class="btn ${d==='ok'?'o':''} full" id="dcOk">${d==='ok'?'승인하기':'수정 요청 보내기'}</button><button class="btn w full" id="dcX" style="margin-top:8px">닫기</button>`);
    document.getElementById('dcX').onclick=closeSheet;
    document.getElementById('dcOk').onclick=async()=>{ const note=document.getElementById('dcN').value.trim().slice(0,300); if(d==='fix'&&!note){ toast('고칠 점을 적어 주세요'); return; } try{ await updateDoc(ed(),{['approvals.'+k]:{d, note, at:Date.now()}}); logE(id, n+' '+(d==='ok'?'승인':'수정 요청')+(note?' · '+note:'')); closeSheet(); toast(d==='ok'?'승인했어요':'수정을 요청했어요'); }catch(err){ toast('실패: '+err.message); } };
  }
  function evSheet(k){ const n=GATES.find(x=>x[0]===k)[1], gg=((E.gates||{})[k])||{};
    sheet(`<h3>${n} 증빙 올리기</h3><label class="field"><span>내용 (샘플 설명·검사 결과·불량률 등)</span><textarea id="evN" rows="3">${esc(gg.note||'')}</textarea></label><label class="field"><span>자료 링크 (사진·보고서, 선택)</span><input id="evU" value="${esc(gg.url||'')}"></label><button class="btn o full" id="evOk">올리고 크리에이터에게 확인 요청</button><button class="btn w full" id="evX" style="margin-top:8px">닫기</button>`);
    document.getElementById('evX').onclick=closeSheet;
    document.getElementById('evOk').onclick=async()=>{ const note=document.getElementById('evN').value.trim().slice(0,500), url=document.getElementById('evU').value.trim().slice(0,300); if(!note){ toast('내용을 적어 주세요'); return; } try{ await updateDoc(ed(),{['gates.'+k]:{st:'review', note, url, at:Date.now()}}); logE(id, n+' 증빙 올리고 확인 요청'); closeSheet(); toast('확인을 요청했어요'); }catch(err){ toast('실패: '+err.message); } };
  }
  function ledSheet(){
    sheet(`<h3>원가 항목 추가</h3><label class="field"><span>종류</span><select id="lgK">${LKINDS.map(k=>`<option>${k}</option>`).join('')}</select></label><label class="field"><span>거래처</span><input id="lgV" maxlength="40"></label><label class="field"><span>금액 (원, 부가세 별도)</span><input id="lgA" type="number" inputmode="numeric" min="0"></label><label class="field"><span>메모 (수량·단가 등)</span><input id="lgN" maxlength="120"></label><label class="field"><span>증빙 링크 (선택)</span><input id="lgU" maxlength="300"></label><button class="btn o full" id="lgOk">장부에 올리기</button><button class="btn w full" id="lgX" style="margin-top:8px">닫기</button>`);
    document.getElementById('lgX').onclick=closeSheet;
    document.getElementById('lgOk').onclick=async()=>{ const kind=document.getElementById('lgK').value, vendor=document.getElementById('lgV').value.trim(), amount=Math.round(+document.getElementById('lgA').value||0), note=document.getElementById('lgN').value.trim(), url=document.getElementById('lgU').value.trim(); if(!amount){ toast('금액을 넣어 주세요'); return; } try{ await addDoc(col('ledger'),{kind, vendor, amount, note, url, at:Date.now(), by:S.user.uid}); logE(id,'원가 장부에 '+kind+' '+won(amount)+' 올림'); closeSheet(); toast('올렸어요'); }catch(err){ toast('실패: '+err.message); } };
  }
  function setSheet(){
    sheet(`<h3>정산 기록 추가</h3><label class="field"><span>금액 (원)</span><input id="stA" type="number" inputmode="numeric" min="0"></label><label class="small" style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="stP" checked> 지급 완료</label><label class="field"><span>메모 (원천징수 등 공제 내역)</span><input id="stN" maxlength="120"></label><button class="btn o full" id="stOk">기록하기</button><button class="btn w full" id="stX" style="margin-top:8px">닫기</button>`);
    document.getElementById('stX').onclick=closeSheet;
    document.getElementById('stOk').onclick=async()=>{ const amount=Math.round(+document.getElementById('stA').value||0), paidF=document.getElementById('stP').checked, note=document.getElementById('stN').value.trim(); if(!amount){ toast('금액을 넣어 주세요'); return; } try{ await addDoc(col('settlements'),{amount, paid:paidF, note, at:Date.now(), by:S.user.uid}); logE(id,'정산 '+(paidF?'지급':'예정')+' '+won(amount)+' 기록'); closeSheet(); toast('기록했어요'); }catch(err){ toast('실패: '+err.message); } };
  }
  function reqSheet(type){
    sheet(`<h3>${RTYPES[type]}</h3><p class="small">${type==='audit'?'에디션마다 1번, 내가 정한 회계사가 장부를 확인할 수 있어요. 3% 넘게 불리한 차이가 나오면 열람 비용은 플랫폼이 내고 차액을 지급해요.':type==='terminate'?'선주문 전이라 기본형은 비용 없이 해지돼요. 해지하면 이 에디션은 닫혀요.':'궁금한 점을 적어 주세요. 답변은 이 화면에 남아요.'}</p><label class="field"><span>내용</span><textarea id="rqN" rows="3"></textarea></label><button class="btn o full" id="rqOk">보내기</button><button class="btn w full" id="rqX" style="margin-top:8px">닫기</button>`);
    document.getElementById('rqX').onclick=closeSheet;
    document.getElementById('rqOk').onclick=async()=>{ const note=document.getElementById('rqN').value.trim().slice(0,500); try{ await addDoc(col('requests'),{uid:S.user.uid, type, note, status:'new', createdAt:serverTimestamp()}); if(type==='terminate'){ await updateDoc(ed(),{status:'cancelled', cancelledAt:Date.now()}); } logE(id, RTYPES[type]+(note?' · '+note:'')); closeSheet(); toast('보냈어요'); }catch(err){ toast('실패: '+err.message); } };
  }
  function ansSheet(rid){
    sheet(`<h3>답변하기</h3><label class="field"><span>답변</span><textarea id="anN" rows="4"></textarea></label><button class="btn o full" id="anOk">답변 남기고 완료</button><button class="btn w full" id="anX" style="margin-top:8px">닫기</button>`);
    document.getElementById('anX').onclick=closeSheet;
    document.getElementById('anOk').onclick=async()=>{ const answer=document.getElementById('anN').value.trim().slice(0,800); if(!answer){ toast('답변을 적어 주세요'); return; } try{ await updateDoc(doc(db,'editions',id,'requests',rid),{status:'done', answer, answeredAt:Date.now()}); logE(id,'요청에 답변'); closeSheet(); toast('답변했어요'); }catch(err){ toast('실패: '+err.message); } };
  }
  sub(onSnapshot(ed(), d=>{
    if(!d.exists()){ V().innerHTML='<div class="empty" style="margin-top:30px">찾을 수 없는 에디션이에요.</div>'; return; }
    E={id:d.id,...d.data()};
    if(E.ownerId!==uid && !S.isAdmin){ V().innerHTML=`<div class="empty" style="margin-top:30px">이 화면은 이 에디션의 크리에이터와 운영자만 볼 수 있어요.<br><a href="#/p/${id}">공개 화면 보기</a></div>`; return; }
    if(!on){ on=true;
      sub(onSnapshot(query(col('ledger'), orderBy('at','desc')), s=>{ LED=s.docs.map(x=>({id:x.id,...x.data()})); draw(); }, ()=>{}));
      sub(onSnapshot(query(col('settlements'), orderBy('at','desc')), s=>{ SET=s.docs.map(x=>({id:x.id,...x.data()})); draw(); }, ()=>{}));
      sub(onSnapshot(query(col('requests'), orderBy('createdAt','desc')), s=>{ REQ=s.docs.map(x=>({id:x.id,...x.data()})); draw(); }, ()=>{}));
      sub(onSnapshot(query(col('log'), orderBy('at','desc'), limit(60)), s=>{ LOG=s.docs.map(x=>({id:x.id,...x.data()})); draw(); }, ()=>{}));
    }
    draw();
  }));
}

/* 운영자 전용 섭외 화면 · 계약 방식 비교 */
function crmG10(x){ const g=x.g10; if(!g) return ''; const ok=/^A|^B/.test(g.verdict||''); return `<section><div class="sec-t">9. 크리에이터 기대 수익 1,000만 원 기준</div><div class="card" style="border-color:${ok?'#2F6B4F':'#B5432F'}"><div class="row between"><b>${esc(g.verdict||'')}</b><span class="pill">${g.adX!=null?'광고 대비 '+Number(g.adX).toFixed(1)+'배':''}</span></div><div class="small" style="margin-top:6px">광고 1건 추정 ${mw(g.ad)} (${esc(g.adBasis||'')})</div><div style="overflow-x:auto"><table style="margin-top:6px;font-size:13px"><tr><th>기대 수익 (성공 85%)</th><th class="r">보수 0.3%</th><th class="r">중간 0.65%</th><th class="r">기대 1.0%</th></tr><tr><td>기본형</td><td class="r">${mw(g.Elo)}</td><td class="r"><b>${mw(g.Emid)}</b></td><td class="r">${mw(g.Ehi)}</td></tr><tr><td>공동 / 직접 (중간)</td><td class="r" colspan="3">${mw(g.Cmid)} / ${mw(g.Dmid)}</td></tr></table></div><div class="tiny" style="margin-top:6px">1,000만 원에 필요한 수량 ${nf(g.req)}개 (중간 예상 ${nf(g.mid)}개) · 필요 기준 조회수 ${nf(g.reqB)}회 (지금 ${nf(g.B)}회) · 판매가 ${won(g.price)} (+10% 반영)</div></div></section>`; }
function crmV3(x){ const v=x.v3; if(!v) return '';
  if(!v.inModel) return `<section><div class="sec-t">8. 계약 방식 비교 (v3.0)</div><div class="card small">${esc(v.note||'비용 모델 43개 밖이에요.')}</div></section>`;
  return `<section><div class="sec-t">8. 계약 방식 비교 (v3.0 비용 모델 · 가정)</div><div class="card small">권장안: 판매가 ${won(v.price)} · 목표 ${nf(v.qty)}개 · 품질 반영 원가 ${won(v.unitQ)} · 품질 관리비 ${won(v.qcFix)} · 실질 이익 ${mw(v.real)} (${v.margin}%) · 등급 ${esc(v.grade)} · 권장가 ${won(v.rec)}</div><div class="card" style="padding:4px 10px;overflow-x:auto"><table style="font-size:13px"><tr><th>방식</th><th class="r">크리에이터</th><th class="r">투자금</th><th class="r">미달 손실</th><th class="r">우리 이익</th></tr><tr><td>기본형</td><td class="r">${mw(v.t1c)} (${v.eff}%)</td><td class="r">0원</td><td class="r">0원</td><td class="r">${mw(v.t1o)}</td></tr><tr><td>공동 투자형</td><td class="r">${mw(v.t2c)}</td><td class="r">${mw(v.t2i)}</td><td class="r">${mw(v.t2f)}</td><td class="r">${mw(v.t2o)}</td></tr><tr><td>직접 투자형</td><td class="r">${mw(v.t3c)}</td><td class="r">${mw(v.t3i)}</td><td class="r">${mw(v.t3f)}</td><td class="r">${mw(v.t3o)}</td></tr></table><div class="tiny" style="margin-top:4px">크리에이터 기대 수익(성공 85%) 기본 ${mw(v.e1)} · 공동 ${mw(v.e2)} · 직접 ${mw(v.e3)} → ${esc(v.best)}이 가장 커요 · 우리 이익은 인건비를 뺀 실질 이익</div></div></section>`;
}

/* ---------- 시작 ---------- */
async function boot(){
  if(isSignInWithEmailLink(auth, location.href)){
    const email=localStorage.getItem('emailForSignIn') || prompt('로그인한 이메일을 넣어 주세요');
    try{ await signInWithEmailLink(auth, email, location.href); localStorage.removeItem('emailForSignIn'); const go=localStorage.getItem('afterLogin')||'admin'; localStorage.removeItem('afterLogin'); history.replaceState(null,'',location.pathname+'#/'+go); }catch(err){ toast('로그인 실패: '+err.message); history.replaceState(null,'',location.pathname+'#/home'); }
  }
  onAuthStateChanged(auth, async user=>{
    if(!user){ try{ await signInAnonymously(auth); }catch(err){ V().innerHTML='<div class="empty">접속 실패: '+esc(err.message)+'</div>'; } return; }
    S.user=user; S.isAdmin=!!(user.email && user.email.toLowerCase()===ADMIN_EMAIL && user.emailVerified);
    try{ const pd=await getDoc(doc(db,'profiles',user.uid)); S.profile = pd.exists()? pd.data() : (S.isAdmin? {roles:['buy'], role:'buy', name:'운영자'} : null); }catch(e){ S.profile=null; }
    if(S.isAdmin && S.profile && !S.profile.createdAt){ try{ await setDoc(doc(db,'profiles',user.uid),{roles:['buy'],role:'buy',name:'운영자',createdAt:serverTimestamp()},{merge:true}); }catch(e){} }
    render();
  });
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
boot();
</script>
