<style>
:root{--ink:#15171C;--sub:#5B606B;--mute:#8B8F98;--line:#E7E3DA;--bg:#F7F5F0;--card:#fff;--ac:#E4572E;--acs:#FFF0EA;--ok:#2F8F5B;--oks:#EAF6EF;--blue:#2F6FDB;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:96px}
header.top{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:20px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;text-decoration:none}
.logo i{font-style:normal;color:var(--ac)}
.tag{font-size:11px;font-weight:800;color:var(--sub);background:#ECE8E0;border-radius:99px;padding:3px 8px}
.who{font-size:12.5px;font-weight:800;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;text-decoration:none}
main{padding:0 18px}
section{margin:20px 0}
h1{font-size:28px;line-height:1.25;letter-spacing:-.035em;margin:0 0 10px}
h2{font-size:21px;line-height:1.35;letter-spacing:-.025em;margin:0 0 10px}
h3{font-size:16.5px;margin:0 0 6px;letter-spacing:-.015em}
p{margin:0 0 10px}
.sub{color:var(--sub)}
.small{font-size:13.5px;color:var(--sub);line-height:1.5}
.tiny{font-size:12px;color:var(--mute);line-height:1.5}
.kick{font-size:13px;font-weight:800;color:var(--ac);margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.card+.card{margin-top:10px}
.ac{color:var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;border-radius:12px;padding:13px 18px;background:var(--ink);color:#fff;text-decoration:none;font-size:15.5px}
.btn.o{background:var(--ac)}
.btn.w{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.s{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:3px 9px;background:#ECE8E0;color:var(--sub)}
.pill.o{background:var(--acs);color:var(--ac)}
.pill.g{background:var(--oks);color:var(--ok)}
.pill.k{background:var(--ink);color:#fff}
.pill.b{background:#E8F0FD;color:var(--blue)}
.sec-t{font-size:12.5px;font-weight:900;color:var(--mute);letter-spacing:.04em;margin:0 0 8px}
.bar{height:9px;background:#EEE9E0;border-radius:99px;overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
.bar.g i{background:var(--ok)}
.ed{display:flex;gap:12px;align-items:center;text-decoration:none}
.ed .th{flex:none;width:72px;height:80px;background:#F3EFE7;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ed .th svg{height:74px;width:auto}
.ed .meta{flex:1;min-width:0}
.ed .t{font-weight:800;font-size:15.5px;line-height:1.3}
.preview{background:linear-gradient(180deg,#F3EFE7,#EDE7DC);border-radius:20px;height:280px;display:flex;align-items:center;justify-content:center;position:relative}
.preview svg{height:240px;width:auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 6px 9px;text-align:center;font-size:13px;font-weight:700}
.tile svg{height:50px;width:auto;display:block;margin:0 auto 4px}
.tile.on{border-color:var(--ac);background:var(--acs)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swb{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;background:#fff;font-size:14px;font-weight:700}
.swb i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.swb.on{border-color:var(--ac);background:var(--acs)}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;font-weight:800;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left}
.role b{display:block;font-size:16px}
.role span{font-size:12.5px;color:var(--sub)}
.role.on{border-color:var(--ac);background:var(--acs)}
.res{background:var(--ink);color:#fff;border-radius:18px;padding:15px}
.res .big{font-size:26px;font-weight:900;letter-spacing:-.03em}
.res .tiny{color:#B9BDC6}
.tl{position:relative;margin:4px 0 0 10px;border-left:2px solid var(--line);padding-left:18px}
.tl .s{position:relative;padding:0 0 13px}
.tl .s:before{content:'';position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.tl .s.done:before{border-color:var(--ink);background:var(--ink)}
.tl .s.now:before{border-color:var(--ac)}
.tl .s b{display:block;font-size:15px}
.tl .s span{font-size:13px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:800}
td.r,th.r{text-align:right;white-space:nowrap}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.qty button{width:42px;height:42px;font-size:20px;font-weight:700}
.qty b{min-width:30px;text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11.5px;font-weight:700;color:var(--mute);text-decoration:none}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--ink)}
nav.tabs a.on svg{stroke:var(--ac)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(21,23,28,.5);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:11px 16px;border-radius:12px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.5}
.beta{background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.5;margin-top:14px}
.beta b{color:#FF8A65}
.loading{padding:60px 0;text-align:center;color:var(--mute)}
.empty{padding:18px;text-align:center;color:var(--mute);font-size:14px;border:1.5px dashed var(--line);border-radius:14px}
.adm select{border:1.5px solid var(--line);border-radius:8px;padding:5px 6px;font-size:13px;background:#fff;max-width:120px}
svg text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.sticky-cta{position:fixed;left:0;right:0;bottom:70px;z-index:25;padding:0 18px}
.sticky-cta .in{max-width:524px;margin:0 auto;padding:8px 0}
</style>
</head>

function beta(){ return '<div class="beta"><b>시험판</b> 실제 결제·생산은 되지 않아요. 전화번호·주소 같은 개인정보는 넣지 마세요.</div>'; }

function tabs(cur){
  const r=S.profile?S.profile.role:'fan';

/* ---------- 라우터 ---------- */
function clearSubs(){ S.unsubs.forEach(u=>{ try{u();}catch(e){} }); S.unsubs=[]; }
function sub(u){ S.unsubs.push(u); }
const V = ()=>document.getElementById('view');
async function render(){
  clearSubs();
  const h=(location.hash||'#/home').replace(/^#\/?/,''); const parts=h.split('/'); const r=parts[0]||'home';
  if(!S.user){ V().innerHTML='<div class="loading">불러오는 중…</div>'; return; }
  if(!S.profile && r!=='start' && r!=='p' && r!=='o' && r!=='admin'){ location.hash='#/start'; return; }
  let tab=r;
  try{
    if(r==='start') viewStart();
    else if(r==='p') { tab=''; viewEdition(parts[1]); }
    else if(r==='o') { tab=''; viewOffer(parts[1], parts[2]); }
    else if(r==='make') viewMake();
    else if(r==='mine') viewMine();
    else if(r==='admin') viewAdmin();
    else if(r==='me') viewMe();
    else { tab='home'; viewHome(); }
  }catch(e){ console.error(e); V().innerHTML='<div class="empty">화면을 그리다 문제가 생겼어요: '+esc(e.message)+'</div>'; }
  tabs(tab);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);

    '<div class="roles" id="roles">'+Object.entries({creator:['인플루언서','내 이름 건 제품, 광고, 판매'],brand:['광고주','팔린 만큼만 내는 판매'],factory:['공장','확정 주문만 받는 생산 슬롯'],fan:['구경·팬','선주문하고 둘러보기']}).map(([k,v])=>'<button class="role '+(role===k?'on':'')+'" data-r="'+k+'"><b>'+v[0]+'</b><span>'+v[1]+'</span></button>').join('')+'</div>'+

    (role==='creator' ? '<label class="field"><span>내 계정 (@아이디)</span><input id="fHandle" maxlength="30" value="'+esc(pr.handle||'')+'" placeholder="@my_handle"></label><div class="grid2"><label class="field"><span>주 플랫폼</span><select id="fPlat">'+['인스타그램','유튜브','틱톡','블로그'].map(x=>'<option '+(pr.platform===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label class="field"><span>팔로워 수</span><input id="fFol" type="number" inputmode="numeric" min="0" value="'+esc(pr.followers||'')+'"></label></div>' : '')+
    '<button class="btn o full" id="fSave">시작하기</button>'+beta()+'</section>';

  function bind(){
    document.getElementById('roles').onclick=e=>{ const b=e.target.closest('[data-r]'); if(!b) return; role=b.dataset.r; V().innerHTML=form(); bind(); };
    document.getElementById('fSave').onclick=async()=>{
      const name=document.getElementById('fName').value.trim(); if(!name){ toast('이름을 넣어 주세요'); return; }
      const data={ role, name, updatedAt: serverTimestamp() };
      if(role==='creator'){ let hd=document.getElementById('fHandle').value.trim(); if(hd && hd[0]!=='@') hd='@'+hd; data.handle=hd||('@'+name); data.platform=document.getElementById('fPlat').value; data.followers=parseInt(document.getElementById('fFol').value||'0',10)||0; }

    };
  }
  V().innerHTML=form(); bind();

/* ---------- 홈 ---------- */
function viewHome(){
  const r=S.profile.role;
  const cta = r==='creator' ? ['내 에디션 만들기','#/make','팬 선주문이 목표를 넘으면 생산돼요. 재고 없이 시작해요.'] : r==='brand' ? ['성과형 상품 등록','#/make','팔린 만큼만 내요. 인플루언서들이 내 상품을 판매 링크로 팔아요.'] : r==='factory' ? ['생산 슬롯 열기','#/make','빈 생산 일정을 열어 두면 확정된 에디션이 채워요.'] : ['선주문 둘러보기','#/home','마음에 드는 에디션을 선주문해 보세요.'];
  V().innerHTML = '<section><div class="kick">'+ROLES[r]+'</div><h1>'+esc(S.profile.name)+' 님, 반가워요.</h1><p class="sub">'+cta[2]+'</p><a class="btn o full" href="'+cta[1]+'">'+cta[0]+'</a></section>'+
    '<section><div class="sec-t">선주문 진행 중</div><div id="hPre"><div class="loading">불러오는 중…</div></div></section>'+
    '<section><div class="sec-t">생산·발송</div><div id="hMake"></div></section>'+
    '<section><div class="sec-t">성과형 판매 상품 (광고주)</div><div id="hOffers"></div></section>'+beta();
  sub(onSnapshot(query(collection(db,'editions'), orderBy('createdAt','desc'), limit(60)), snap=>{
    const all=snap.docs.map(d=>({id:d.id,...d.data()}));
    const pre=all.filter(e=>e.status==='pre'), mk=all.filter(e=>e.status==='closed'||e.status==='making'||e.status==='shipped');

    b.innerHTML = mk.length ? mk.map(edCard).join('') : '<div class="empty">생산 중인 에디션이 아직 없어요.</div>';
  }, err=>{ const a=document.getElementById('hPre'); if(a) a.innerHTML='<div class="empty">불러오기 실패: '+esc(err.message)+'</div>'; }));
  sub(onSnapshot(query(collection(db,'offers'), orderBy('createdAt','desc'), limit(30)), snap=>{
    const c=document.getElementById('hOffers'); if(!c) return; const list=snap.docs.map(d=>({id:d.id,...d.data()}));
    c.innerHTML = list.length ? list.map(o=>offerCard(o)).join('') : '<div class="empty">등록된 상품이 아직 없어요.</div>';
    bindOfferButtons(c);
  }));
}
function offerCard(o){ const mine = S.profile && S.profile.role==='creator'; return '<div class="card"><div class="row between"><div><b>'+esc(o.name)+'</b> <span class="tiny">'+esc(o.brand||'')+'</span><div class="small">'+won(o.price)+' · 판매하면 '+o.commission+'% ('+won(o.price*o.commission/100)+')</div></div><span class="pill">'+(o.sold||0)+'개 팔림</span></div>'+(o.desc?'<div class="small" style="margin-top:6px">'+esc(o.desc)+'</div>':'')+'<div class="row" style="margin-top:10px"><a class="btn w s" href="#/o/'+o.id+'">상품 보기</a>'+(mine?'<button class="btn s" data-link="'+o.id+'">내 판매 링크 복사</button>':'')+'</div></div>'; }
function linkSheet(title,url){ const sh=document.getElementById('sheet'), m=document.getElementById('modal'); sh.innerHTML='<h3>'+esc(title)+'</h3><p class="small">아래 링크를 길게 눌러 복사하세요.</p><label class="field"><input id="lkU" readonly value="'+esc(url)+'"></label><button class="btn w full" id="lkX">닫기</button>'; m.classList.add('on'); const i=document.getElementById('lkU'); i.focus(); i.select(); document.getElementById('lkX').onclick=()=>m.classList.remove('on'); m.onclick=ev=>{ if(ev.target===m) m.classList.remove('on'); }; }
async function copyLink(title,url,okMsg){ try{ await navigator.clipboard.writeText(url); toast(okMsg); }catch(e){ linkSheet(title,url); } }
function bindOfferButtons(root){ root.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>copyLink('내 판매 링크', location.origin+location.pathname+'#/o/'+b.dataset.link+'/'+S.user.uid, '판매 링크를 복사했어요')); }

/* ---------- 에디션 (선주문) 페이지 ---------- */
function viewEdition(id){
  V().innerHTML='<div class="loading">불러오는 중…</div>';
  sub(onSnapshot(doc(db,'editions',id), d=>{
    if(!d.exists()){ V().innerHTML='<div class="empty" style="margin-top:30px">찾을 수 없는 에디션이에요.</div>'; return; }
    const e={id:d.id,...d.data()}, p=P(e.product), s=e.sold||0, pct=Math.min(100,Math.round(s/e.goal*100)), left=Math.max(0,e.goal-s);
    const steps = [['선주문','pre'],['마감·생산 대기','closed'],['생산','making'],['발송','shipped']];
    const idx = Math.max(0, steps.findIndex(x=>x[1]===e.status));
    V().innerHTML = '<a class="small" href="#/home" style="display:inline-block;margin-top:14px;text-decoration:none">← 홈</a>'+
      '<div class="preview" style="margin-top:8px">'+artFor(e)+'</div>'+
      '<section>'+statusPill(e)+'<h2 style="margin:8px 0 2px">'+esc(e.title)+' '+p.name+'</h2><div class="small">'+esc(e.handle||e.ownerName)+' 에디션 · '+p.size+' · '+esc(O(p,e.opt).n)+'</div><div style="font-size:26px;font-weight:900;margin-top:8px">'+won(e.price)+'</div></section>'+
      '<div class="card"><div class="row between"><b>'+s+'개 주문</b><span class="small">목표 '+e.goal+'개</span></div><div class="bar'+(s>=e.goal?' g':'')+'" style="height:11px"><i style="width:'+pct+'%"></i></div><div class="small">'+(e.status==='pre' ? (left>0?'<b class="ac">'+left+'개</b> 더 모이면 생산을 시작해요. ':'목표를 넘었어요. 마감까지 계속 받아요. ')+'목표를 못 채우면 <b>전액 환불</b>돼요.' : e.status==='refunded' ? '목표를 채우지 못해 모든 주문이 환불돼요.' : e.status==='shipped' ? '생산을 마치고 발송했어요.' : '선주문을 마감했어요. '+(e.status==='making'?'지금 생산 중이에요.':'공장 배정 뒤 생산을 시작해요.'))+'</div></div>'+
      '<section><div class="sec-t">진행 순서</div><div class="tl">'+steps.map((x,i)=>'<div class="s '+(i<idx?'done':i===idx?'now':'')+'"><b>'+x[0]+'</b><span>'+(i===0?(e.status==='pre'?dleft(e)+' · 목표 '+e.goal+'개':'완료'):i===2?p.weeks:'')+'</span></div>').join('')+'</div></section>'+
      '<section><div class="sec-t">누가 만드나요</div><div class="card small"><b style="color:var(--ink)">기획</b> '+esc(e.handle||e.ownerName)+' (판매 수익의 일부를 받아요)<br><b style="color:var(--ink)">판매·품질 책임</b> 에디션(가칭)<br><b style="color:var(--ink)">제조</b> <span id="facName">'+(e.slotId?'불러오는 중…':'협력 공장 (배정되면 표시)')+'</span></div></section>'+
      '<div class="row" style="margin:10px 0 80px"><button class="btn w full" id="share">공유하기</button></div>'+
      (e.status==='pre' ? '<div class="sticky-cta"><div class="in"><button class="btn o full" id="buy">선주문하기 (시험) · '+won(e.price)+'</button></div></div>' : '')+beta();
    document.getElementById('share').onclick=async()=>{ const url=location.origin+location.pathname+'#/p/'+e.id; if(navigator.share){ try{ await navigator.share({title:e.title+' '+p.name, url}); }catch(x){} } else { copyLink('에디션 링크', url, '링크를 복사했어요'); } };
    if(e.slotId){ getDoc(doc(db,'slots',e.slotId)).then(sd=>{ const f=document.getElementById('facName'); if(f) f.textContent = sd.exists()? (sd.data().factoryName+' · '+sd.data().week+' 생산') : '협력 공장'; }).catch(()=>{}); }
    const b=document.getElementById('buy'); if(b) b.onclick=()=>buySheet(e);
  }));
}
function buySheet(e){
  let qty=1; const sh=document.getElementById('sheet'), m=document.getElementById('modal');
  function draw(){ sh.innerHTML='<h3>선주문 (시험)</h3><div class="small" style="margin-bottom:10px">'+esc(e.title)+' '+P(e.product).name+'</div>'+
    '<label class="field"><span>주문자 닉네임 (실명·연락처 넣지 마세요)</span><input id="bNick" maxlength="20" value="'+esc((S.profile&&S.profile.name)||'')+'"></label>'+
    '<div class="row between"><div class="qty"><button id="qm">−</button><b>'+qty+'</b><button id="qp">+</button></div><div style="font-size:22px;font-weight:900">'+won(e.price*qty)+'</div></div>'+
    '<div class="note" style="margin:12px 0">시험판이라 실제 결제는 되지 않아요. 주문 수만 올라가요.</div>'+
    '<button class="btn o full" id="bOk">시험 주문 넣기</button><button class="btn w full" id="bX" style="margin-top:8px">닫기</button>';
    document.getElementById('qm').onclick=()=>{ qty=Math.max(1,qty-1); draw(); };
    document.getElementById('qp').onclick=()=>{ qty=Math.min(10,qty+1); draw(); };
    document.getElementById('bX').onclick=()=>m.classList.remove('on');
    document.getElementById('bOk').onclick=async()=>{
      const nick=document.getElementById('bNick').value.trim()||'익명';
      const btn=document.getElementById('bOk'); btn.disabled=true; btn.textContent='저장 중…';
      try{
        const pref=doc(collection(db,'preorders'));
        const bt=writeBatch(db);
        bt.set(pref,{ uid:S.user.uid, editionId:e.id, nick, qty, amount:e.price*qty, status:'test', createdAt:serverTimestamp() });
        bt.update(doc(db,'editions',e.id),{ sold:increment(qty), lastOrderId:pref.id });
        await bt.commit();
        m.classList.remove('on'); toast(qty+'개 시험 주문 완료');
      }catch(err){ btn.disabled=false; btn.textContent='시험 주문 넣기'; toast('주문 실패: '+err.message); }
    };
  }
  m.onclick=ev=>{ if(ev.target===m) m.classList.remove('on'); };
  draw(); m.classList.add('on');
}

    '<section><label class="field"><span>에디션 이름 (12자까지)</span><input id="fT" maxlength="12" value="'+esc(d.title)+'"></label>'+
    '<div class="card"><div class="row between small"><b style="color:var(--ink)">판매가</b><b id="mp" style="color:var(--ink)">'+won(d.price)+'</b></div><input type="range" id="fP" min="'+p.lo+'" max="'+p.hi+'" step="500" value="'+d.price+'" style="width:100%;accent-color:#E4572E">'+
    '<div class="row between small" style="margin-top:8px"><b style="color:var(--ink)">목표 수량</b><b id="mg" style="color:var(--ink)">'+d.goal+'개</b></div><input type="range" id="fG" min="'+p.min+'" max="'+(p.min*5)+'" step="'+(p.min>=200?10:5)+'" value="'+d.goal+'" style="width:100%;accent-color:#E4572E"></div></section>'+
    '<div class="res" id="res"></div>'+
    '<section><button class="btn o full" id="mk">선주문 열기 (2주)</button></section>'+beta();
  }
  function res(){ const p=P(d.product); const mine=d.goal*d.price*SHARE; document.getElementById('res').innerHTML='<div class="tiny">목표 '+d.goal+'개를 채우면 내 몫 (25%)</div><div class="big">'+won(mine)+'</div><div class="tiny">1개당 '+won(d.price*SHARE)+' · 사업자가 아니면 원천징수 3.3% 뒤 '+won(mine*0.967)+'</div>'; }

  '<section><div class="sec-t">계정</div><div class="card small">이 기기 전용 계정이에요. 앱을 지우거나 브라우저 기록을 지우면 다시 만들어야 해요. 정식판에서는 이메일·카카오 로그인을 붙여요.<div class="tiny" style="margin-top:6px">계정 번호 '+esc(S.user.uid.slice(0,8))+'…</div></div>'+
  (S.isAdmin?'<button class="btn w full" id="lo" style="margin-top:10px">운영자 로그아웃</button>':'<a class="btn w full" href="#/admin" style="margin-top:10px">운영자 로그인</a>')+'</section>'+
  '<section><div class="sec-t">이 시험판에 대해</div><div class="card small">v0.1 · 2026.11.5 · 인플루언서 에디션 선주문, 공장 슬롯, 성과형 상품, 운영 화면. 실제 결제(토스페이먼츠 지급대행), 정식 로그인, 배송 관리는 다음 단계예요.</div></section>'+beta();
  const lo=document.getElementById('lo'); if(lo) lo.onclick=async()=>{ await signOut(auth); toast('로그아웃했어요'); };
}

/* ---------- 시작 ---------- */
async function boot(){
  if(isSignInWithEmailLink(auth, location.href)){
    let email=localStorage.getItem('emailForSignIn') || prompt('로그인한 이메일을 넣어 주세요');
    try{ await signInWithEmailLink(auth, email, location.href); localStorage.removeItem('emailForSignIn'); const go=localStorage.getItem('afterLogin')||'admin'; localStorage.removeItem('afterLogin'); history.replaceState(null,'',location.pathname+'#/'+go); }catch(err){ toast('로그인 실패: '+err.message); history.replaceState(null,'',location.pathname+'#/home'); }
  }
  onAuthStateChanged(auth, async user=>{
    if(!user){ try{ await signInAnonymously(auth); }catch(err){ V().innerHTML='<div class="empty">접속 실패: '+esc(err.message)+'</div>'; } return; }
    S.user=user; S.isAdmin = !!(user.email && user.email.toLowerCase()===ADMIN_EMAIL && user.emailVerified);
    try{ const pd=await getDoc(doc(db,'profiles',user.uid)); S.profile = pd.exists()? pd.data() : (S.isAdmin? {role:'fan', name:'운영자'} : null); }catch(e){ S.profile=null; }
    if(S.isAdmin && !S.profile.createdAt){ try{ await setDoc(doc(db,'profiles',user.uid),{role:'fan',name:'운영자',createdAt:serverTimestamp()},{merge:true}); }catch(e){} }
    render();
  });
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
boot();
</script>
